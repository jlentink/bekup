# TLS options for every router (task 0.7b). Mozilla "intermediate" without
# CBC and without DHE: TLS 1.2 with ECDHE + AEAD only, plus TLS 1.3 (whose
# cipher suites Go chooses and are all strong). Hybrid post-quantum key
# exchange (X25519MLKEM768) first.
tls:
  options:
    default:
      minVersion: VersionTLS12
      cipherSuites:
        - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305
        - TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305
      curvePreferences:
        - X25519MLKEM768
        - X25519
        - CurveP256
        - CurveP384
      # Reject handshakes without a matching SNI (no default certificate is
      # ever served to scanners probing by IP address).
      sniStrict: true
      alpnProtocols:
        - h2
        - http/1.1
