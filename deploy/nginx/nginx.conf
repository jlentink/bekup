# nginx main configuration for the `nginx` compose profile (task 0.7b).
# Mounted read-only at /etc/nginx/nginx.conf. The site configuration is
# rendered by deploy/nginx/entrypoint.sh into /tmp/nginx/conf.d (tmpfs) from
# the templates next to this file.
#
# Runs as UID 65532 on unprivileged ports (8080 HTTP, 8443 HTTPS) with a
# read-only root filesystem and no capabilities. No Docker socket.

worker_processes 2;
pid /tmp/nginx.pid;
error_log stderr notice;

events {
    worker_connections 4096;
}

http {
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    default_type application/octet-stream;
    server_tokens off;

    # Access log without query strings, and with the single-use download
    # ticket (GET /api/download/{ticket}, D-056) redacted from the path.
    map $uri $bekup_log_path {
        ~^/api/download/  "/api/download/[redacted]";
        default           $uri;
    }
    log_format bekup escape=json
        '{"time":"$time_iso8601","remote_addr":"$remote_addr",'
        '"method":"$request_method","path":"$bekup_log_path",'
        '"protocol":"$server_protocol","host":"$host","status":$status,'
        '"bytes_sent":$body_bytes_sent,"request_time":$request_time,'
        '"upstream_status":"$upstream_status","tls":"$ssl_protocol",'
        '"user_agent":"$http_user_agent"}';
    access_log /dev/stdout bekup;

    # WebSocket upgrade (GraphQL subscriptions on /graphql, D-052).
    map $http_upgrade $bekup_connection_upgrade {
        default upgrade;
        ""      "";
    }

    # Request limits. bekup enforces [server] max_body_bytes (1 MiB) itself.
    client_max_body_size        2m;
    client_body_buffer_size     128k;
    client_header_buffer_size   4k;
    large_client_header_buffers 4 16k;
    client_header_timeout       15s;
    client_body_timeout         30s;
    keepalive_timeout           75s;
    # Between two writes to the client; downloads stream for as long as needed.
    send_timeout                300s;
    reset_timedout_connection   on;

    # Light per-client-IP limits ($binary_remote_addr is the TCP peer; a
    # client-supplied X-Forwarded-For is never used). bekup adds stricter
    # limits for logins and sensitive mutations (task 1.1).
    limit_req_zone  $binary_remote_addr zone=bekup_req:10m rate=50r/s;
    limit_conn_zone $binary_remote_addr zone=bekup_conn:10m;
    limit_req_status  429;
    limit_conn_status 429;

    # Docker's embedded DNS. The upstream is resolved per request, so nginx
    # starts (and answers 502) even while serve is down.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # TLS: Mozilla "intermediate" without CBC and DHE (ECDHE + AEAD only),
    # TLS 1.2 and 1.3, hybrid post-quantum key exchange first.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_ecdh_curve X25519MLKEM768:X25519:prime256v1:secp384r1;
    ssl_prefer_server_ciphers off;
    # No SHA-1/SHA-224 signatures in TLS 1.2 handshakes.
    ssl_conf_command SignatureAlgorithms ed25519:ECDSA+SHA256:ECDSA+SHA384:ECDSA+SHA512:rsa_pss_rsae_sha256:rsa_pss_rsae_sha384:rsa_pss_rsae_sha512:rsa_pss_pss_sha256:rsa_pss_pss_sha384:rsa_pss_pss_sha512:RSA+SHA256:RSA+SHA384:RSA+SHA512;
    ssl_session_cache shared:bekup_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Container healthcheck (loopback only).
    server {
        listen 127.0.0.1:8081;
        access_log off;
        location = /healthz {
            default_type text/plain;
            return 200 "ok\n";
        }
        location / {
            return 404;
        }
    }

    include /tmp/nginx/conf.d/*.conf;
}
