# The opt-in external API (D-220): included into the HTTPS server block of
# bekup-https.conf.tmpl by deploy/nginx/entrypoint.sh ONLY when
# BEKUP_EXTERNAL_API=enabled. https://<domain>/api/v1/ goes to the external
# API; serve keeps everything else, including /api/download/. The proxy
# headers of the server block apply (X-Forwarded-For is SET to the client
# address; external-api.toml [listen] trusted_proxies names this proxy's
# fixed address).
location ^~ /api/v1/ {
    # The external API accepts only an empty body or {} ([limits]
    # max_body_bytes is 16 KiB by default).
    client_max_body_size 16k;
    # Resolved per request through Docker DNS on the internal `frontend`
    # network. Plain HTTP never leaves that network.
    set $bekup_api_upstream external-api:8081;
    proxy_pass http://$bekup_api_upstream;
    proxy_read_timeout 30s;
    # The access log names only the known route shapes (nginx.conf,
    # $bekup_log_path). Error-level messages (an unreachable upstream, a
    # too-large body) would quote the raw request line, which may carry a
    # token a client put into the path by mistake: only critical messages
    # here; the access log still records the status and upstream_status.
    error_log stderr crit;
}
