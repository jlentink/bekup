# bekup compose.yaml: bekup with its own Traefik reverse proxy (D-205).
# Docs: https://github.com/jlentink/bekup/blob/main/docs/installation/compose.md
#
# GENERATED from the repository's docker-compose.yml by `just gen`; never
# edit it by hand. Two forms differ only in the x-bekup-image line below:
#   - the release asset compose.yaml: the image is pinned by digest and the
#     file is attested. Verify it: gh attestation verify compose.yaml --repo
#     jlentink/bekup (needs `gh auth login`, or use cosign verify-blob);
#   - deploy/compose/compose.yaml in the repository: the image comes from
#     BEKUP_IMAGE (digest-pinned); setup keeps it in .env.
#
# Install, as root in an empty directory (e.g. /opt/bekup); needs a DNS name
# pointing at this host and ports 80/443 free:
#   1. Save this file there as compose.yaml.
#   2. DOCKER_GID=$(stat -c %g /var/run/docker.sock) docker compose run --rm setup
#      (repository copy: prefix BEKUP_IMAGE=<repo>:<tag>@sha256:<digest>)
#   3. docker compose up -d
#      docker compose run --rm admin create --email you@example.com --display-name "Your Name"
# Upgrade: back up, replace this file with the new release's compose.yaml,
# then: docker compose run --rm setup upgrade && docker compose pull && docker compose up -d
# (repository copy: keep this file current from deploy/compose/ and run
# BEKUP_IMAGE=<new image> docker compose run --rm setup upgrade instead).
#
# Do not edit this file: put local changes into compose.override.yaml
# (`docker compose -f compose.yaml run --rm setup check` lints both; -f keeps
# the override away from the checking container). setup writes the
# compose variables to .env.
#
# Components and trust boundaries:
#   traefik (80/443, Let's Encrypt) ──frontend──> serve
#   serve ──backend (TLS, verify-full)──> postgres  (role bekup_app; migrations as bekup_owner)
#   serve ──runner-ctl (mTLS gRPC)──> runner ──docker.sock──> dockerd
#   runner ──targets──> target databases   (runner only; serve can never reach them)
#   serve ──egress──> S3 / SFTP / SMTP / webhooks (SSRF-guarded in the app)

name: bekup

# The bekup image: the ONLY place it is named (setup and the release replace
# this one line with the digest-pinned reference, `just gen` with the
# BEKUP_IMAGE placeholder of deploy/compose/; D-205).
x-bekup-image: &bekup-image ${BEKUP_IMAGE:?set BEKUP_IMAGE to the digest-pinned bekup image repo:tag@sha256:digest, see the README}

# ---------------------------------------------------------------------------
# Shared hardening for every bekup container (merged with `<<:`).
# ---------------------------------------------------------------------------
x-bekup-hardening: &bekup-hardening
  image: *bekup-image
  # distroless "nonroot" UID/GID; never root.
  user: "65532:65532"
  # Immutable root filesystem: a compromised process cannot drop binaries or
  # persist anything outside the explicitly mounted volumes.
  read_only: true
  # The only writable scratch space; noexec so nothing written there can run.
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=64m
  # bekup needs no Linux capabilities at all (it binds ports >1024).
  cap_drop: [ALL]
  # Blocks privilege gain through setuid/setgid binaries or file capabilities.
  security_opt:
    - no-new-privileges:true
  # Bounded logs so a noisy container cannot fill the host disk.
  logging: &bekup-logging
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

# ---------------------------------------------------------------------------
# App database: the bundled `postgres` service below (TLS for the bekup
# roles, least-privilege roles bekup_owner / bekup_app; D-054, D-100). The
# external-database variants (compose.external-db.yaml, ...; D-208) replace
# this note, drop the postgres service and connect to your own PostgreSQL
# (docs/installation/external-database.md).
# ---------------------------------------------------------------------------

services:
  # -------------------------------------------------------------------------
  # setup: the one-shot installer `bekup setup` (D-203, D-205). Run it
  # explicitly in this directory; `docker compose up` never starts it:
  #   DOCKER_GID=$(stat -c %g /var/run/docker.sock) docker compose run --rm setup
  #   docker compose run --rm setup upgrade    (after replacing compose.yaml)
  #   docker compose run --rm setup check
  # It writes .env, bekup.toml, runner.toml, the secrets and certificates,
  # deploy/** and reference/* here; it never writes compose.yaml. Root, but
  # with CAP_CHOWN only (it hands every file to the container user that
  # reads it), no network, a read-only root and no logs (the passphrase
  # prompt never reaches Docker's log files). Keep the CA key offline: mount
  # the media for the run, e.g.
  #   docker compose run --rm -v /media/usb/bekup-ca:/deploy/secrets/certs/ca setup
  # `bekup setup check` requires this service exactly as shipped.
  # -------------------------------------------------------------------------
  setup:
    image: *bekup-image
    profiles: [setup]
    user: "0:0"
    entrypoint: ["/usr/local/bin/bekup", "setup"]
    command: ["init"]
    environment:
      # A container cannot know its own digest: setup compares this with the
      # x-bekup-image line of compose.yaml.
      BEKUP_IMAGE: *bekup-image
      # Group of the Docker socket on the host: stat -c %g /var/run/docker.sock
      DOCKER_GID: ${DOCKER_GID:-}
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    cap_drop: [ALL]
    cap_add: [CHOWN]
    security_opt:
      - no-new-privileges:true
    network_mode: none
    logging:
      driver: none
    stdin_open: true
    tty: true
    volumes:
      - type: bind
        source: .
        target: /deploy
        bind:
          create_host_path: false
    restart: "no"
    deploy:
      resources:
        # scrypt sealing of the CA key needs about 256 MiB.
        limits: { cpus: "1.00", memory: 512M, pids: 64 }

  # -------------------------------------------------------------------------
  # certs-init: one-shot generation of the private CA and per-component mTLS
  # certificates (task 0.6, `bekup certs init`). Run it explicitly:
  #   docker compose --profile setup run --rm certs-init
  # It prompts (no echo) for a CA key passphrase (min 16 characters) and
  # writes below ${BEKUP_KEYS_DIR:-./secrets}/certs (docs/security/mtls-certs.md):
  #   ca/ca.crt, ca/ca.key (age-encrypted)  -> move ca/ OFFLINE afterwards
  #   runner/{runner.crt,runner.key,ca.crt}, serve/{serve.crt,serve.key,ca.crt}
  #   postgres/{postgres.crt,postgres.key,ca.crt}  (bundled app DB TLS, D-100)
  # It is the ONLY container that ever sees the CA private key. serve,
  # runner and postgres each receive only their own directory's files as
  # Docker secrets (see `secrets:`); serve and migrate also get
  # postgres/ca.crt to verify the database. Rotation (with ca/ temporarily restored):
  #   docker compose --profile setup run --rm certs-init certs rotate --dir=/certs --all --no-audit
  # certs-init has no database access, so rotations here need --no-audit
  # (D-118): record the rotation afterwards, or run `bekup certs rotate` from a
  # host/container that can reach the app DB so it lands in the audit log.
  # -------------------------------------------------------------------------
  certs-init:
    <<: *bekup-hardening
    profiles: [setup]
    command:
      - certs
      - init
      - --dir=/certs
      - --component=runner
      - --component=serve
      - --component=postgres
    volumes:
      - type: bind
        source: ${BEKUP_KEYS_DIR:-./secrets}/certs
        target: /certs
        bind:
          create_host_path: false
    # No network at all: certificate generation needs none.
    network_mode: none
    restart: "no"
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 128M, pids: 32 }

  # -------------------------------------------------------------------------
  # migrate: applies the goose migrations as bekup_owner, then exits.
  # Only this one-shot container ever holds the owner credentials; serve runs
  # as bekup_app and can therefore never alter the schema or the audit-log
  # protections (D-054).
  # -------------------------------------------------------------------------
  migrate:
    <<: *bekup-hardening
    command: [migrate, up]
    environment:
      # Path, not a secret: [database] owner_url_file (this is also the
      # default). migrate never receives the bekup_app URL, and serve never
      # receives this owner secret.
      BEKUP_DATABASE_OWNER_URL_FILE: /run/secrets/bekup_database_owner_url
    configs:
      - source: bekup_toml
        target: /etc/bekup/bekup.toml
    secrets:
      - bekup_database_owner_url
      # CA bundle that signs the postgres certificate: [database]
      # tls_ca_file (default path), verified with tls_mode = "verify-full".
      - source: bekup_db_ca_crt
        target: bekup_db_ca.crt
    networks: [backend]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 256M, pids: 64 }

  # -------------------------------------------------------------------------
  # admin: one-shot break-glass account administration (`bekup admin`,
  # D-069, D-113), e.g. the first admin:
  #   docker compose run --rm admin create --email you@example.com --display-name "You"
  # (the password is prompted twice on the terminal; for --password-file
  # mount the file: `run --rm -v "$PWD/pw:/run/pw:ro" admin create ...
  # --password-file /run/pw`). A separate service because `docker compose
  # run serve ...` cannot start next to the running serve: both would claim
  # serve's fixed network address. Same role as serve (bekup_app, D-054),
  # but only the `backend` network and only the DB login (URL, or the
  # password file with an external database) + DB CA: no master key, no
  # mTLS client certificate, no ports.
  # -------------------------------------------------------------------------
  admin:
    <<: *bekup-hardening
    profiles: [admin]
    entrypoint: ["/usr/local/bin/bekup", "admin"]
    command: ["--help"]
    configs:
      - source: bekup_toml
        target: /etc/bekup/bekup.toml
    secrets:
      - bekup_database_url
      - source: bekup_db_ca_crt
        target: bekup_db_ca.crt
    networks: [backend]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"
    deploy:
      resources:
        # argon2id hashing (64 MiB per hash).
        limits: { cpus: "1.00", memory: 256M, pids: 64 }

  # -------------------------------------------------------------------------
  # serve: GraphQL API, UI, scheduler and River workers.
  # Plain HTTP on one internal network shared only with the reverse proxy;
  # TLS is terminated by the proxy (D-017). Its port is deliberately NOT
  # published.
  # -------------------------------------------------------------------------
  serve:
    <<: *bekup-hardening
    command: [serve]
    configs:
      - source: bekup_toml
        target: /etc/bekup/bekup.toml
    secrets:
      - bekup_master_key
      - bekup_database_url
      # App DB TLS (D-100): [database] tls_ca_file default path.
      - source: bekup_db_ca_crt
        target: bekup_db_ca.crt
      - source: serve_ca_crt
        target: bekup_ca.crt
      - source: bekup_client_crt
        target: bekup_client.crt
      - source: bekup_client_key
        target: bekup_client.key
    volumes:
      # Root of disk destinations (confined via os.Root, D-055).
      - bekup-backups:/var/lib/bekup/backups
      # Restore staging (D-022). Size it for your largest artifact.
      - bekup-scratch:/var/lib/bekup/scratch
    networks:
      frontend:
        # Fixed address so [server] listen can bind to this interface only
        # (listen = "10.213.250.10:8080"): serve is then unreachable from the
        # backend, egress and runner-ctl networks.
        ipv4_address: ${SERVE_FRONTEND_IP:-10.213.250.10}
      backend: {}
      runner-ctl: {}
      egress: {}
      metrics:
        # Fixed address for [metrics] listen = "10.213.252.10:9464": the
        # Prometheus endpoint (task 5.6) is reachable only from this
        # internal network, never from the proxy, backend, egress or
        # runner-ctl networks.
        # Attach your Prometheus here (docs/operations.md#metrics).
        ipv4_address: ${SERVE_METRICS_IP:-10.213.252.10}
    # NO `ports:`. Never publish serve; only the reverse proxy reaches it,
    # and the metrics port (9464) only from the `metrics` network.
    healthcheck:
      # Exec form: distroless has no shell. `bekup healthcheck serve` GETs
      # /healthz (liveness) on the server.listen address (D-080, D-102).
      test: ["CMD", "/usr/local/bin/bekup", "healthcheck", "serve"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      runner:
        condition: service_started
    restart: unless-stopped
    # > workers.shutdown_timeout (2m) + 30s hard stop (D-145).
    stop_grace_period: 180s
    deploy:
      resources:
        # argon2id (64 MiB x argon2_max_concurrent) + S3 multipart buffers
        # (part size x concurrency) dominate memory; raise with care.
        limits: { cpus: "2.00", memory: 2G, pids: 512 }

  # -------------------------------------------------------------------------
  # runner: the ONLY component with Docker access (D-003). Starts the
  # digest-pinned dump containers with a fixed, hardened spec.
  # -------------------------------------------------------------------------
  runner:
    <<: *bekup-hardening
    command: [runner]
    # Do not set `hostname:`: the runner detects its own container through
    # the default hostname (container ID) to join per-run networks. If that
    # fails, set runner.toml [docker] self_container
    # (env BEKUP_DOCKER_SELF_CONTAINER).
    configs:
      - source: runner_toml
        target: /etc/bekup/runner.toml
    secrets:
      - source: runner_ca_crt
        target: bekup_ca.crt
      - source: runner_crt
        target: runner.crt
      - source: runner_key
        target: runner.key
    # Access to the Docker socket is equivalent to root on the host. That is
    # why it is confined to this small, typed, mTLS-only service that accepts
    # no free-form commands and runs only allowlisted images (D-029–D-033).
    # `:ro` does NOT restrict the Docker API; it only stops the socket inode
    # being replaced. See docs/installation/rootless-docker.md for rootless
    # Docker / userns-remap as additional hardening.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # Supplementary group owning the socket on the host:
    #   stat -c %g /var/run/docker.sock
    group_add:
      - "${DOCKER_GID:-999}"
    networks:
      runner-ctl:
        # Fixed address so [listen] address can bind to this interface only
        # (listen address = "10.213.251.10:7443"). The gRPC port is then
        # unreachable from the targets network and from dump containers on
        # the per-run networks.
        ipv4_address: ${RUNNER_CTL_IP:-10.213.251.10}
      targets: {}
    # Deliberately NOT on `backend`: the runner has no database access.
    healthcheck:
      # Exec form (distroless). Queries the standard gRPC health service on
      # the container-local unix socket listen.health_socket (default
      # /tmp/bekup-runner/health.sock on the private /tmp tmpfs; D-125). It is
      # SERVING only while the mTLS listener is up and the runner certificate
      # is valid. No client certificate is involved.
      test: ["CMD", "/usr/local/bin/bekup", "healthcheck", "runner"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    stop_grace_period: 60s
    deploy:
      resources:
        # The runner only proxies streams; dump containers get their own
        # limits from runner.toml [docker].
        limits: { cpus: "1.00", memory: 512M, pids: 256 }

  # -------------------------------------------------------------------------
  # postgres: bekup's own app database (not a backup target).
  # TLS only for the bekup roles (D-100): deploy/postgres/entrypoint.sh copies
  # the certificate/key into a private tmpfs (PostgreSQL insists on owning a
  # 0600 key) and starts the server with ssl=on and TLS >= 1.2; the init
  # script's pg_hba.conf rejects every non-TLS TCP login of bekup_owner and
  # bekup_app. The superuser stays socket-only.
  # -------------------------------------------------------------------------
  postgres:
    image: postgres:17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
    # Run directly as the image's postgres user (UID 70 on alpine): the
    # entrypoint then needs no root, no chown and no gosu, so every
    # capability can be dropped.
    user: "70:70"
    entrypoint: ["/bin/sh", "/usr/local/bin/bekup-entrypoint.sh"]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
      - /var/run/postgresql:rw,noexec,nosuid,nodev,size=1m,uid=70,gid=70,mode=0700
      # Runtime copies of the TLS certificate/key (deploy/postgres/entrypoint.sh).
      - /var/lib/postgresql/tls:rw,noexec,nosuid,nodev,size=1m,uid=70,gid=70,mode=0700
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    shm_size: 256m
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      # SCRAM everywhere; no trust/md5 for TCP connections.
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256 --data-checksums"
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      # Read only by deploy/postgres/init/10-bekup-roles.sh (NOT bekup config
      # keys): the role passwords as Docker secret files.
      POSTGRES_BEKUP_OWNER_PASSWORD_FILE: /run/secrets/bekup_owner_password
      POSTGRES_BEKUP_APP_PASSWORD_FILE: /run/secrets/bekup_app_password
      # Read only by deploy/postgres/entrypoint.sh (these are the defaults).
      POSTGRES_BEKUP_TLS_CERT_FILE: /run/secrets/postgres.crt
      POSTGRES_BEKUP_TLS_KEY_FILE: /run/secrets/postgres.key
      POSTGRES_BEKUP_TLS_CA_FILE: /run/secrets/postgres_ca.crt
    # entrypoint.sh appends -c ssl=on, ssl_min_protocol_version=TLSv1.2 and
    # the ssl_{cert,key,ca}_file settings.
    command:
      - postgres
      - -c
      - password_encryption=scram-sha-256
      - -c
      - log_connections=on
      - -c
      - log_disconnections=on
    secrets:
      - postgres_password
      - bekup_owner_password
      - bekup_app_password
      - source: postgres_crt
        target: postgres.crt
      - source: postgres_key
        target: postgres.key
      - source: bekup_db_ca_crt
        target: postgres_ca.crt
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Creates bekup_owner / bekup_app and the bekup database on first start.
      - type: bind
        source: ./deploy/postgres/init
        target: /docker-entrypoint-initdb.d
        read_only: true
        bind:
          create_host_path: false
      # TLS wrapper around the image's docker-entrypoint.sh.
      - type: bind
        source: ./deploy/postgres/entrypoint.sh
        target: /usr/local/bin/bekup-entrypoint.sh
        read_only: true
        bind:
          create_host_path: false
    networks: [backend]
    # NO `ports:`: only serve and migrate reach the database.
    healthcheck:
      test: ["CMD", "pg_isready", "--host=/var/run/postgresql", "--username=postgres", "--dbname=postgres"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: unless-stopped
    stop_grace_period: 60s
    logging: *bekup-logging
    deploy:
      resources:
        limits: { cpus: "2.00", memory: 1G, pids: 256 }

  # =========================================================================
  # Reverse proxy: Traefik v3 (task 0.7b), started with the stack.
  # TLS for the UI is terminated here (D-017, D-048); serve stays unpublished
  # on the internal `frontend` network. Traefik gets no Docker socket.
  # Proxy-only environment (compose variables in .env, NOT bekup config keys):
  #   BEKUP_DOMAIN    public host name, e.g. backup.example.com (required)
  #   ACME_EMAIL      Let's Encrypt account e-mail (required for ACME)
  #   ACME_CA_SERVER  ACME directory (default Let's Encrypt production)
  #   PROXY_TLS_MODE  acme (default) | static (your certificate in
  #                   proxy-tls/, mounted by compose.override.yaml)
  #   PROXY_FRONTEND_IP  Traefik's fixed address on `frontend`
  #                   (default 10.213.250.5); bekup.toml [server]
  #                   trusted_proxies must name exactly this address (/32).
  # Docs: docs/installation/reverse-proxy.md
  # =========================================================================

  # One-shot: hands the ACME storage volume to UID 65532 (Docker creates
  # named volumes root-owned). Only CHOWN/FOWNER, no network.
  traefik-init:
    image: &traefik-image traefik:v3.7.16@sha256:c8a121e4bb1347e8fd52657fab12f2cb70b68f8a018895e2068f92c9e519b9c2
    user: "0:0"
    entrypoint: ["/bin/sh", "-c", "chown 65532:65532 /acme && chmod 0700 /acme"]
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER]
    security_opt:
      - no-new-privileges:true
    volumes:
      - traefik-acme:/acme
    network_mode: none
    restart: "no"
    logging: *bekup-logging

  # Traefik v3 with Let's Encrypt (HTTP-01). Static + dynamic configuration
  # from deploy/traefik/ via the FILE provider: no Docker provider, so no
  # Docker socket. Routes to the fixed URL http://serve:8080.
  traefik:
    image: *traefik-image
    user: "65532:65532"
    entrypoint: ["/bin/sh", "/etc/traefik/bekup/entrypoint.sh"]
    command: []
    environment:
      BEKUP_DOMAIN: ${BEKUP_DOMAIN:-}
      ACME_EMAIL: ${ACME_EMAIL:-}
      ACME_CA_SERVER: ${ACME_CA_SERVER:-https://acme-v02.api.letsencrypt.org/directory}
      PROXY_TLS_MODE: ${PROXY_TLS_MODE:-acme}
      PROXY_HTTPS_PUBLIC_PORT: "443"
    read_only: true
    tmpfs:
      # Rendered configuration lives here (deploy/traefik/entrypoint.sh).
      - /tmp:rw,noexec,nosuid,nodev,size=32m,uid=65532,gid=65532,mode=0700
    # Unprivileged ports inside the container: no NET_BIND_SERVICE needed.
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    volumes:
      - type: bind
        source: ./deploy/traefik
        target: /etc/traefik/bekup
        read_only: true
        bind:
          create_host_path: false
      # acme.json (account key + certificates), 0600 inside a 0700 dir.
      - traefik-acme:/acme
    ports:
      - "80:8080"
      - "443:8443"
    networks:
      frontend:
        ipv4_address: ${PROXY_FRONTEND_IP:-10.213.250.5}
      edge: {}
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--configFile=/tmp/traefik/traefik.yml"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      traefik-init:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 30s
    logging: *bekup-logging
    deploy:
      resources:
        limits: { cpus: "1.00", memory: 256M, pids: 256 }

# ---------------------------------------------------------------------------
# Networks: segmented so every component reaches only what it needs.
# `internal: true` networks have no route to the outside world.
#
# The two fixed subnets lie outside Docker's default address pools
# (172.17-31.0.0/16, 192.168.0.0/16) so they cannot collide with networks
# Docker allocates automatically. If they clash with your LAN, override the
# compose variables (shell or .env next to this file) AND update bekup.toml /
# runner.toml to match:
#   FRONTEND_SUBNET, SERVE_FRONTEND_IP, PROXY_FRONTEND_IP, RUNNER_CTL_SUBNET,
#   RUNNER_CTL_IP
# (compose interpolation only; these are not bekup configuration keys).
# ---------------------------------------------------------------------------
networks:
  # Reverse proxy <-> serve. The proxy has the fixed address
  # PROXY_FRONTEND_IP (10.213.250.5), so [server] trusted_proxies can name
  # exactly that address (D-048, D-093).
  frontend:
    internal: true
    ipam:
      config:
        - subnet: ${FRONTEND_SUBNET:-10.213.250.0/24}
  # serve/migrate <-> postgres.
  backend:
    internal: true
  # serve <-> runner (mTLS gRPC).
  runner-ctl:
    internal: true
    ipam:
      config:
        - subnet: ${RUNNER_CTL_SUBNET:-10.213.251.0/24}
  # runner -> target databases (and SSH bastions). Not internal: targets may
  # live anywhere; the runner's target allowlist decides (D-029).
  targets: {}
  # serve -> destinations (S3, SFTP), SMTP and webhooks. Not internal; every
  # dial goes through the app's SSRF guard (D-055).
  egress: {}
  # Prometheus -> serve /metrics (task 5.6). Internal and empty by default:
  # attach a Prometheus container to it (in an override file, or from
  # another compose project as the external network `bekup_metrics`).
  metrics:
    internal: true
    ipam:
      config:
        - subnet: ${METRICS_SUBNET:-10.213.252.0/24}
  # Traefik <-> internet (published 80/443, ACME). Published ports need a
  # non-internal network, so Traefik cannot publish them on `frontend`.
  edge: {}

volumes:
  postgres-data: {}
  bekup-backups: {}
  bekup-scratch: {}
  # Traefik's ACME state: the account key and the TLS private keys. Back it
  # up like a secret.
  traefik-acme: {}

# ---------------------------------------------------------------------------
# Configuration files: mounted read-only at /etc/bekup/ (search path step 3,
# D-019). They hold no secrets. Keep them root-owned and not group/world
# writable (bekup refuses to start otherwise).
# ---------------------------------------------------------------------------
configs:
  bekup_toml:
    file: ./bekup.toml
  runner_toml:
    file: ./runner.toml

# ---------------------------------------------------------------------------
# Secrets: file-based Docker secrets from ./secrets/ (gitignored), mounted at
# /run/secrets/<name>. Set the compose variable BEKUP_KEYS_DIR (shell or
# .env; absolute, or relative to this file) to keep them elsewhere, e.g. on
# an encrypted volume outside the project directory. Secrets are never put in environment variables, argv or
# the TOML files (D-019). Each service receives only the secrets it needs.
# The file must be readable by the consuming container's UID (65532 for
# bekup, 70 for postgres) with mode 0400/0600; see the docs.
# ---------------------------------------------------------------------------
secrets:
  bekup_master_key:
    file: ${BEKUP_KEYS_DIR:-./secrets}/bekup_master_key
  # postgres://bekup_app:...@postgres:5432/bekup  (TLS comes from bekup.toml
  # [database] tls_mode; an sslmode in the URL may not be stricter)
  bekup_database_url:
    file: ${BEKUP_KEYS_DIR:-./secrets}/bekup_database_url
  # postgres://bekup_owner:...@postgres:5432/bekup (migrate only)
  bekup_database_owner_url:
    file: ${BEKUP_KEYS_DIR:-./secrets}/bekup_database_owner_url
  postgres_password:
    file: ${BEKUP_KEYS_DIR:-./secrets}/postgres_password
  bekup_owner_password:
    file: ${BEKUP_KEYS_DIR:-./secrets}/bekup_owner_password
  bekup_app_password:
    file: ${BEKUP_KEYS_DIR:-./secrets}/bekup_app_password
  # Written by certs-init. The CA *key* (./secrets/certs/ca/ca.key) is never
  # given to any long-running service. Each component gets the CA trust
  # bundle from its own directory (it holds both CAs during a CA rotation),
  # so ./secrets/certs/ca/ can be kept offline.
  serve_ca_crt:
    file: ${BEKUP_KEYS_DIR:-./secrets}/certs/serve/ca.crt
  bekup_client_crt:
    file: ${BEKUP_KEYS_DIR:-./secrets}/certs/serve/serve.crt
  bekup_client_key:
    file: ${BEKUP_KEYS_DIR:-./secrets}/certs/serve/serve.key
  runner_ca_crt:
    file: ${BEKUP_KEYS_DIR:-./secrets}/certs/runner/ca.crt
  runner_crt:
    file: ${BEKUP_KEYS_DIR:-./secrets}/certs/runner/runner.crt
  runner_key:
    file: ${BEKUP_KEYS_DIR:-./secrets}/certs/runner/runner.key
  # App DB TLS (D-100): postgres server certificate + key (postgres only,
  # readable by UID 70) and the CA bundle (postgres, serve, migrate).
  postgres_crt:
    file: ${BEKUP_KEYS_DIR:-./secrets}/certs/postgres/postgres.crt
  postgres_key:
    file: ${BEKUP_KEYS_DIR:-./secrets}/certs/postgres/postgres.key
  bekup_db_ca_crt:
    file: ${BEKUP_KEYS_DIR:-./secrets}/certs/postgres/ca.crt
