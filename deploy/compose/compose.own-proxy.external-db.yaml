# bekup compose.yaml: bekup behind YOUR own reverse proxy on this Docker host
# (Nginx Proxy Manager, Traefik, Caddy, nginx, ...; D-215).
# Docs: https://github.com/jlentink/bekup/blob/main/docs/installation/reverse-proxy.md#own-reverse-proxy
#
# GENERATED from the repository's docker-compose.yml by `just gen`; never
# edit it by hand. Two forms differ only in the x-bekup-image line below:
#   - the release asset compose.own-proxy.external-db.yaml: the image is pinned by
#     digest and the file is attested. Verify it (after saving it as
#     compose.yaml): gh attestation verify compose.yaml --repo jlentink/bekup
#     (needs `gh auth login`, or use cosign verify-blob);
#   - deploy/compose/compose.own-proxy.external-db.yaml in the repository: the image comes
#     from BEKUP_IMAGE (digest-pinned, or ghcr.io/jlentink/bekup:latest to
#     follow the newest release, D-212); setup keeps it in .env.
#
# serve joins the Docker network your proxy is on (setup asks for it and for
# the proxy's container name) under the alias bekup-serve: point your proxy
# at http://bekup-serve:8080. Find the network in a second terminal:
#   docker inspect <proxy container> --format '{{json .NetworkSettings.Networks}}'
# Install, as root in an empty directory (e.g. /opt/bekup):
#   1. Save this file there as compose.yaml, and your PostgreSQL's CA bundle
#      (PEM) next to it when its certificate comes from your own CA: setup
#      asks for the TLS mode and that file's path, and copies it.
#   2. DOCKER_GID=$(stat -c %g /var/run/docker.sock) docker compose run --rm setup
#      (repository copy: prefix BEKUP_IMAGE=<repo>:<tag>@sha256:<digest>,
#      or BEKUP_IMAGE=ghcr.io/jlentink/bekup:latest to follow the releases)
#   3. Once, create bekup's roles and database on your PostgreSQL (setup
#      prints the exact command; docs/installation/external-database.md), e.g.
#      docker compose run --rm migrate db bootstrap --admin-user <admin>
#   4. docker compose up -d
#      docker compose run --rm admin create --email you@example.com --display-name "Your Name"
#   4. In your proxy: the domain -> http://bekup-serve:8080 (no WebSocket
#      upgrade, no response buffering, its own HSTS off; setup prints the
#      settings for NPM, Traefik, Caddy and nginx).
# Upgrade: back up, replace this file with the new release's file, then:
#   docker compose run --rm setup upgrade && docker compose pull && docker compose up -d
# Repository copy: keep this file current from deploy/compose/, then
#   pinned:    BEKUP_IMAGE=<new pinned image> docker compose run --rm setup upgrade
#              && docker compose up -d
#   following: docker compose pull && docker compose run --rm setup upgrade
#              && docker compose up -d
#
# Do not edit this file: put local changes into compose.override.yaml
# (`docker compose -f compose.yaml run --rm setup check` lints both; -f keeps
# the override away from the checking container). setup writes the
# compose variables to .env and, for the Traefik labels, the link network or
# a database container, compose.override.yaml.
#
# Components and trust boundaries:
#   your proxy ──its Docker network (external; serve as bekup-serve)──> serve:8080
#   serve, migrate ──backend (NOT internal; TLS verify-full by default)──> YOUR PostgreSQL  (bekup.toml [database]; role bekup_app; migrations as bekup_owner)
#   serve ──runner-ctl (mTLS gRPC)──> runner ──docker.sock──> dockerd
#   runner ──targets──> target databases   (runner only; serve can never reach them)
#   serve ──egress──> S3 / SFTP / SMTP / webhooks (SSRF-guarded in the app)

name: bekup

# The bekup image: the ONLY place it is named (the release replaces this one
# line with the digest-pinned reference, setup with the image the operator
# names (digest-pinned, or ghcr.io/jlentink/bekup:latest to follow; D-212),
# `just gen` with the BEKUP_IMAGE placeholder of deploy/compose/; D-205).
x-bekup-image: &bekup-image ${BEKUP_IMAGE:?set BEKUP_IMAGE to the bekup image, digest-pinned repo:tag@sha256:digest or ghcr.io/jlentink/bekup:latest, see the README}

# ---------------------------------------------------------------------------
# Shared hardening for every bekup container (merged with `<<:`).
# ---------------------------------------------------------------------------
x-bekup-hardening: &bekup-hardening
  image: *bekup-image
  # distroless "nonroot" UID/GID; never root.
  user: "65532:65532"
  # Immutable root filesystem: a compromised process cannot drop binaries or
  # persist anything outside the explicitly mounted volumes.
  read_only: true
  # The only writable scratch space; noexec so nothing written there can run.
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=64m
  # bekup needs no Linux capabilities at all (it binds ports >1024).
  cap_drop: [ALL]
  # Blocks privilege gain through setuid/setgid binaries or file capabilities.
  security_opt:
    - no-new-privileges:true
  # Bounded logs so a noisy container cannot fill the host disk.
  logging: &bekup-logging
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

# ---------------------------------------------------------------------------
# App database: YOUR PostgreSQL 15-17 (D-207, D-208), configured in
# bekup.toml [database] (fields mode: host, port, name, the fixed roles
# bekup_app / bekup_owner, the TLS mode you chose: verify-full against the CA
# bundle that setup copied to <keys>/bekup_database_ca.crt (the default) or
# against the system CA bundle, or the weakened require / disable, D-215).
# There is no postgres service.
# Create the roles and the database once, before the first `up -d` (setup
# prints the exact command for your choice; docs/installation/
# external-database.md):
#   docker compose run --rm migrate db bootstrap --admin-user <admin>
#   docker compose run --rm migrate migrate check
# serve, migrate and admin reach it over the `backend` network, which is
# therefore NOT internal: allow only this host in the database's firewall
# and pg_hba.conf. A database CONTAINER on this Docker host is reached over
# its own Docker network instead (setup adds it in compose.override.yaml,
# and `backend` stays internal; D-215).
# ---------------------------------------------------------------------------

services:
  # -------------------------------------------------------------------------
  # setup: the one-shot installer `bekup setup` (D-203, D-205). Run it
  # explicitly in this directory; `docker compose up` never starts it:
  #   DOCKER_GID=$(stat -c %g /var/run/docker.sock) docker compose run --rm setup
  #   docker compose run --rm setup upgrade    (after replacing compose.yaml)
  #   docker compose run --rm setup check
  # It writes .env, bekup.toml, runner.toml, the secrets and certificates,
  # deploy/** and reference/* here; it never writes compose.yaml. Root, but
  # with CAP_CHOWN only (it hands every file to the container user that
  # reads it), no network, a read-only root and no logs (the passphrase
  # prompt never reaches Docker's log files). Keep the CA key offline: mount
  # the media for the run, e.g.
  #   docker compose run --rm -v /media/usb/bekup-ca:/deploy/secrets/certs/ca setup
  # `bekup setup check` requires this service exactly as shipped.
  # -------------------------------------------------------------------------
  setup:
    image: *bekup-image
    profiles: [setup]
    user: "0:0"
    entrypoint: ["/usr/local/bin/bekup", "setup"]
    command: ["init"]
    environment:
      # A container cannot know its own digest: setup compares this with the
      # x-bekup-image line of compose.yaml.
      BEKUP_IMAGE: *bekup-image
      # Group of the Docker socket on the host: stat -c %g /var/run/docker.sock
      DOCKER_GID: ${DOCKER_GID:-}
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    cap_drop: [ALL]
    cap_add: [CHOWN]
    security_opt:
      - no-new-privileges:true
    network_mode: none
    logging:
      driver: none
    stdin_open: true
    tty: true
    volumes:
      - type: bind
        source: .
        target: /deploy
        bind:
          create_host_path: false
    restart: "no"
    deploy:
      resources:
        # scrypt sealing of the CA key needs about 256 MiB.
        limits: { cpus: "1.00", memory: 512M, pids: 64 }

  # -------------------------------------------------------------------------
  # certs-init: one-shot generation of the private CA and per-component mTLS
  # certificates (task 0.6, `bekup certs init`). Run it explicitly:
  #   docker compose --profile setup run --rm certs-init
  # It prompts (no echo) for a CA key passphrase (min 16 characters) and
  # writes below ${BEKUP_KEYS_DIR:-./secrets}/certs (docs/security/mtls-certs.md):
  #   ca/ca.crt, ca/ca.key (age-encrypted)  -> move ca/ OFFLINE afterwards
  #   runner/{runner.crt,runner.key,ca.crt}, serve/{serve.crt,serve.key,ca.crt}
  # No database certificate: your PostgreSQL has its own, which serve and
  # migrate verify against the CA bundle in bekup_db_ca.crt. It is the ONLY
  # container that ever sees the CA private key. serve and runner each
  # receive only their own directory's files as Docker secrets (see
  # `secrets:`). Rotation (with ca/ temporarily restored):
  #   docker compose --profile setup run --rm certs-init certs rotate --dir=/certs --all --no-audit
  # certs-init has no database access, so rotations here need --no-audit
  # (D-118): record the rotation afterwards, or run `bekup certs rotate` from a
  # host/container that can reach the app DB so it lands in the audit log.
  # -------------------------------------------------------------------------
  certs-init:
    <<: *bekup-hardening
    profiles: [setup]
    command:
      - certs
      - init
      - --dir=/certs
      - --component=runner
      - --component=serve
    volumes:
      - type: bind
        source: ${BEKUP_KEYS_DIR:-./secrets}/certs
        target: /certs
        bind:
          create_host_path: false
    # No network at all: certificate generation needs none.
    network_mode: none
    restart: "no"
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 128M, pids: 32 }

  # -------------------------------------------------------------------------
  # migrate: applies the goose migrations as bekup_owner, then exits.
  # Only this one-shot container ever holds the owner credentials; serve runs
  # as bekup_app and can therefore never alter the schema or the audit-log
  # protections (D-054).
  # -------------------------------------------------------------------------
  migrate:
    <<: *bekup-hardening
    command: [migrate, up]
    environment:
      # Written to .env by `bekup setup` (D-212): migrate refuses to run
      # when its version differs from the one setup prepared this directory
      # for (run `docker compose run --rm setup upgrade` first); "following"
      # when the image follows a tag instead of a digest.
      BEKUP_SETUP_VERSION: ${BEKUP_SETUP_VERSION:-}
      BEKUP_IMAGE_MODE: ${BEKUP_IMAGE_MODE:-}
    configs:
      - source: bekup_toml
        target: /etc/bekup/bekup.toml
    secrets:
      # [database] owner_password_file (bekup_owner: migrations) and
      # password_file (bekup_app: `db bootstrap` creates the role with its
      # SCRAM verifier). serve never receives the owner password.
      - bekup_database_owner_password
      - bekup_database_password
      # CA bundle of your PostgreSQL's server certificate: [database]
      # tls_ca_file (default path), verified with tls_mode = "verify-full"
      # (empty when another TLS choice needs none, D-215).
      - source: bekup_db_ca_crt
        target: bekup_db_ca.crt
    networks: [backend]
    restart: "no"
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 256M, pids: 64 }

  # -------------------------------------------------------------------------
  # admin: one-shot break-glass account administration (`bekup admin`,
  # D-069, D-113), e.g. the first admin:
  #   docker compose run --rm admin create --email you@example.com --display-name "You"
  # (the password is prompted twice on the terminal; for --password-file
  # mount the file: `run --rm -v "$PWD/pw:/run/pw:ro" admin create ...
  # --password-file /run/pw`). A separate service because `docker compose
  # run serve ...` cannot start next to the running serve: both would claim
  # serve's fixed network address. Same role as serve (bekup_app, D-054),
  # but only the `backend` network and only the DB login (URL, or the
  # password file with an external database) + DB CA: no master key, no
  # mTLS client certificate, no ports.
  # -------------------------------------------------------------------------
  admin:
    <<: *bekup-hardening
    profiles: [admin]
    entrypoint: ["/usr/local/bin/bekup", "admin"]
    command: ["--help"]
    configs:
      - source: bekup_toml
        target: /etc/bekup/bekup.toml
    secrets:
      - bekup_database_password
      - source: bekup_db_ca_crt
        target: bekup_db_ca.crt
    networks: [backend]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"
    deploy:
      resources:
        # argon2id hashing (64 MiB per hash).
        limits: { cpus: "1.00", memory: 256M, pids: 64 }

  # -------------------------------------------------------------------------
  # serve: GraphQL API, UI, scheduler and River workers.
  # Plain HTTP; YOUR reverse proxy terminates TLS (D-017) and reaches serve
  # on the proxy's own Docker network as http://bekup-serve:8080. Its port
  # is deliberately NOT published.
  # -------------------------------------------------------------------------
  serve:
    <<: *bekup-hardening
    command: [serve]
    environment:
      # Written to .env by `bekup setup` (D-212): serve refuses to start on
      # another version than setup prepared; with "following" (or when the
      # runner reports an unpinned image) it warns, audits and alerts about
      # the unpinned image.
      BEKUP_SETUP_VERSION: ${BEKUP_SETUP_VERSION:-}
      BEKUP_IMAGE_MODE: ${BEKUP_IMAGE_MODE:-}
      # The own-proxy shape (D-215): Docker assigns serve's address on your
      # proxy's network, so bekup.toml [server] listen = "0.0.0.0:8080" with
      # allow_wildcard_listen. With this literal serve accepts connections
      # only on its own address on your proxy's network (the alias
      # bekup-serve; plus loopback for the healthcheck) and closes every
      # other one (bekup's internal networks, the database network), and it
      # skips the wildcard warning for exactly that address. No port is
      # published.
      BEKUP_LISTEN_SHAPE: own-proxy-join
    configs:
      - source: bekup_toml
        target: /etc/bekup/bekup.toml
    secrets:
      - bekup_master_key
      # Your PostgreSQL (fields mode, D-207): [database] password_file.
      - bekup_database_password
      # App DB TLS (D-100): [database] tls_ca_file default path.
      - source: bekup_db_ca_crt
        target: bekup_db_ca.crt
      - source: serve_ca_crt
        target: bekup_ca.crt
      - source: bekup_client_crt
        target: bekup_client.crt
      - source: bekup_client_key
        target: bekup_client.key
    volumes:
      # Root of disk destinations (confined via os.Root, D-055).
      - bekup-backups:/var/lib/bekup/backups
      # Restore staging (D-022). Size it for your largest artifact.
      - bekup-scratch:/var/lib/bekup/scratch
    networks:
      proxy:
        # YOUR reverse proxy's Docker network (BEKUP_PROXY_NETWORK). Your
        # proxy forwards to http://bekup-serve:8080; bekup.toml [server]
        # trusted_proxy_hosts names your proxy's container, so only it may
        # forward client addresses (X-Forwarded-For).
        aliases: [bekup-serve]
      backend: {}
      runner-ctl: {}
      egress: {}
      metrics:
        # Fixed address for [metrics] listen = "10.213.252.10:9464": the
        # Prometheus endpoint (task 5.6) is reachable only from this
        # internal network, never from the proxy, backend, egress or
        # runner-ctl networks.
        # Attach your Prometheus here (docs/operations.md#metrics).
        ipv4_address: ${SERVE_METRICS_IP:-10.213.252.10}
    # NO `ports:`. Never publish serve; only the reverse proxy reaches it,
    # and the metrics port (9464) only from the `metrics` network.
    healthcheck:
      # Exec form: distroless has no shell. `bekup healthcheck serve` GETs
      # /healthz (liveness) on the server.listen address (D-080, D-102).
      test: ["CMD", "/usr/local/bin/bekup", "healthcheck", "serve"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully
      runner:
        condition: service_started
    restart: unless-stopped
    # > workers.shutdown_timeout (2m) + 30s hard stop (D-145).
    stop_grace_period: 180s
    deploy:
      resources:
        # argon2id (64 MiB x argon2_max_concurrent) + S3 multipart buffers
        # (part size x concurrency) dominate memory; raise with care.
        limits: { cpus: "2.00", memory: 2G, pids: 512 }

  # -------------------------------------------------------------------------
  # runner: the ONLY component with Docker access (D-003). Starts the
  # digest-pinned dump containers with a fixed, hardened spec.
  # -------------------------------------------------------------------------
  runner:
    <<: *bekup-hardening
    command: [runner]
    environment:
      # Written to .env by `bekup setup` (D-212): the runner refuses to start
      # on another version than setup prepared, before it opens Docker or
      # its gRPC listener; "following" needs BEKUP_SETUP_VERSION. Whether its
      # own image is pinned the runner reads from Docker (Health), not from
      # here.
      BEKUP_SETUP_VERSION: ${BEKUP_SETUP_VERSION:-}
      BEKUP_IMAGE_MODE: ${BEKUP_IMAGE_MODE:-}
    # Do not set `hostname:`: the runner detects its own container through
    # the default hostname (container ID) to join per-run networks. If that
    # fails, set runner.toml [docker] self_container
    # (env BEKUP_DOCKER_SELF_CONTAINER).
    configs:
      - source: runner_toml
        target: /etc/bekup/runner.toml
    secrets:
      - source: runner_ca_crt
        target: bekup_ca.crt
      - source: runner_crt
        target: runner.crt
      - source: runner_key
        target: runner.key
    # Access to the Docker socket is equivalent to root on the host. That is
    # why it is confined to this small, typed, mTLS-only service that accepts
    # no free-form commands and runs only allowlisted images (D-029–D-033).
    # `:ro` does NOT restrict the Docker API; it only stops the socket inode
    # being replaced. See docs/installation/rootless-docker.md for rootless
    # Docker / userns-remap as additional hardening.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # Supplementary group owning the socket on the host:
    #   stat -c %g /var/run/docker.sock
    group_add:
      - "${DOCKER_GID:-999}"
    networks:
      runner-ctl:
        # Fixed address so [listen] address can bind to this interface only
        # (listen address = "10.213.251.10:7443"). The gRPC port is then
        # unreachable from the targets network and from dump containers on
        # the per-run networks.
        ipv4_address: ${RUNNER_CTL_IP:-10.213.251.10}
      targets: {}
    # Deliberately NOT on `backend`: the runner has no database access.
    healthcheck:
      # Exec form (distroless). Queries the standard gRPC health service on
      # the container-local unix socket listen.health_socket (default
      # /tmp/bekup-runner/health.sock on the private /tmp tmpfs; D-125). It is
      # SERVING only while the mTLS listener is up and the runner certificate
      # is valid. No client certificate is involved.
      test: ["CMD", "/usr/local/bin/bekup", "healthcheck", "runner"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    stop_grace_period: 60s
    deploy:
      resources:
        # The runner only proxies streams; dump containers get their own
        # limits from runner.toml [docker].
        limits: { cpus: "1.00", memory: 512M, pids: 256 }

# ---------------------------------------------------------------------------
# Networks: segmented so every component reaches only what it needs.
# `internal: true` networks have no route to the outside world.
#
# The fixed subnets lie outside Docker's default address pools
# (172.17-31.0.0/16, 192.168.0.0/16) so they cannot collide with networks
# Docker allocates automatically. If they clash with your LAN, override the
# compose variables (in .env) AND update bekup.toml / runner.toml to match:
#   RUNNER_CTL_SUBNET, RUNNER_CTL_IP, METRICS_SUBNET, SERVE_METRICS_IP,
#   BEKUP_PROXY_NETWORK
# (compose interpolation only; these are not bekup configuration keys).
# ---------------------------------------------------------------------------
networks:
  # YOUR reverse proxy's network (D-215): it exists already (your proxy is
  # on it), so it is external; setup writes its name to .env
  # (BEKUP_PROXY_NETWORK). Only serve joins it. Other containers on it can
  # reach serve:8080 directly, but cannot forge client addresses: only the
  # proxy containers named in trusted_proxy_hosts are trusted.
  proxy:
    external: true
    name: ${BEKUP_PROXY_NETWORK:-bekup-proxy}
  # serve/migrate/admin <-> YOUR PostgreSQL (D-208). NOT internal: an
  # internal network has no route off this host. Docker cannot narrow it to
  # the database's address, so serve, migrate and admin can reach any host
  # through it (serve already can, through `egress`): allow only this host
  # in the database's firewall and pg_hba.conf, and keep tls_mode
  # verify-full.
  backend: {}
  # serve <-> runner (mTLS gRPC).
  runner-ctl:
    internal: true
    ipam:
      config:
        - subnet: ${RUNNER_CTL_SUBNET:-10.213.251.0/24}
  # runner -> target databases (and SSH bastions). Not internal: targets may
  # live anywhere; the runner's target allowlist decides (D-029).
  targets: {}
  # serve -> destinations (S3, SFTP), SMTP and webhooks. Not internal; every
  # dial goes through the app's SSRF guard (D-055).
  egress: {}
  # Prometheus -> serve /metrics (task 5.6). Internal and empty by default:
  # attach a Prometheus container to it (in an override file, or from
  # another compose project as the external network `bekup_metrics`).
  metrics:
    internal: true
    ipam:
      config:
        - subnet: ${METRICS_SUBNET:-10.213.252.0/24}

volumes:
  bekup-backups: {}
  bekup-scratch: {}

# ---------------------------------------------------------------------------
# Configuration files: mounted read-only at /etc/bekup/ (search path step 3,
# D-019). They hold no secrets. Keep them root-owned and not group/world
# writable (bekup refuses to start otherwise).
# ---------------------------------------------------------------------------
configs:
  bekup_toml:
    file: ./bekup.toml
  runner_toml:
    file: ./runner.toml

# ---------------------------------------------------------------------------
# Secrets: file-based Docker secrets from ./secrets/ (gitignored), mounted at
# /run/secrets/<name>. Set the compose variable BEKUP_KEYS_DIR (shell or
# .env; absolute, or relative to this file) to keep them elsewhere, e.g. on
# an encrypted volume outside the project directory. Secrets are never put in environment variables, argv or
# the TOML files (D-019). Each service receives only the secrets it needs.
# The file must be readable by the consuming container's UID (65532 for
# bekup) with mode 0400/0600; see the docs.
# ---------------------------------------------------------------------------
secrets:
  bekup_master_key:
    file: ${BEKUP_KEYS_DIR:-./secrets}/bekup_master_key
  # Your PostgreSQL (fields mode, D-207): the bekup_app password (serve,
  # admin, migrate; in single-account mode the account's password) and the
  # bekup_owner password (migrate only; empty in single-account mode).
  # Written by setup, readable only by UID 65532.
  bekup_database_password:
    file: ${BEKUP_KEYS_DIR:-./secrets}/bekup_database_password
  bekup_database_owner_password:
    file: ${BEKUP_KEYS_DIR:-./secrets}/bekup_database_owner_password
  # Written by certs-init. The CA *key* (./secrets/certs/ca/ca.key) is never
  # given to any long-running service. Each component gets the CA trust
  # bundle from its own directory (it holds both CAs during a CA rotation),
  # so ./secrets/certs/ca/ can be kept offline.
  serve_ca_crt:
    file: ${BEKUP_KEYS_DIR:-./secrets}/certs/serve/ca.crt
  bekup_client_crt:
    file: ${BEKUP_KEYS_DIR:-./secrets}/certs/serve/serve.crt
  bekup_client_key:
    file: ${BEKUP_KEYS_DIR:-./secrets}/certs/serve/serve.key
  runner_ca_crt:
    file: ${BEKUP_KEYS_DIR:-./secrets}/certs/runner/ca.crt
  runner_crt:
    file: ${BEKUP_KEYS_DIR:-./secrets}/certs/runner/runner.crt
  runner_key:
    file: ${BEKUP_KEYS_DIR:-./secrets}/certs/runner/runner.key
  # CA bundle (PEM) of your PostgreSQL's server certificate ([database]
  # tls_ca_file), copied by setup from the file you named; public, not a
  # secret (serve, admin, migrate). Empty when you chose the system CA
  # bundle, require or disable (D-215): compose still mounts it.
  bekup_db_ca_crt:
    file: ${BEKUP_KEYS_DIR:-./secrets}/bekup_database_ca.crt
