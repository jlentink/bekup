# DEV ONLY configuration for `bekup serve` in docker-compose.dev.yml.
# Mounted read-only at /etc/bekup/bekup.toml. Contains no secrets: they come
# from /run/secrets/* (generated by deploy/dev/gen-dev-keys.sh).

[server]
listen = "0.0.0.0:8080"
# Direct access in dev. With a proxy profile (traefik | nginx) set
# BEKUP_DEV_BASE_URL=https://bekup.localhost:8443 (docker-compose.dev.yml
# passes it to serve as BEKUP_SERVER_BASE_URL).
base_url = "http://localhost:8080"
# The dev proxy's fixed `frontend` address (PROXY_FRONTEND_IP). Optional in
# dev mode, but set so forwarded headers behave exactly as in production.
trusted_proxies = ["10.213.250.5/32"]

[database]
# Same as production (D-100): TLS with the dev CA from gen-dev-keys.sh,
# mounted as /run/secrets/bekup_db_ca.crt.
tls_mode = "verify-full"
tls_ca_file = "/run/secrets/bekup_db_ca.crt"

[netguard]
# The dev destinations live on the private `egress` network.
allow_hosts = ["minio", "sftp", "mailpit"]

[log]
level = "debug"
format = "text"

[dev]
enabled = true
