# runner.toml: configuration of `bekup runner`, the only component with
# Docker access. It is a separate file so that serve's configuration can never
# change the runner's allowlists.
#
# Copy to ./runner.toml or /etc/bekup/runner.toml (or pass --config <path> /
# BEKUP_CONFIG). The first file found wins; files are never merged. The file
# must be a regular file owned by the runner user or root and must not be
# group- or world-writable. Unknown keys are errors.
#
# Precedence: built-in defaults < this file < BEKUP_<SECTION>_<KEY> env vars
# < command-line flags. Example: [docker] gid -> BEKUP_DOCKER_GID.
#
# Every value below is the built-in default unless marked "example".
# Full reference: docs/configuration.md

[listen]
# mTLS gRPC listener on the internal runner network. Never publish this port.
# Example; match your network: the runner's fixed address in
# docker-compose.yml (RUNNER_CTL_IP). The built-in default ":7443" binds
# every interface and is refused outside dev mode unless allow_wildcard = true.
address = "10.213.251.10:7443"
# Allow a wildcard listen address (":7443", "0.0.0.0:7443", "[::]:7443")
# outside dev mode. Logs a warning at every startup.
allow_wildcard = false

[tls]
# Certificates from `bekup certs init` (TLS 1.3, private CA).
cert_file = "/run/secrets/runner.crt"
# Private key: must not be group/world-writable or world-readable.
key_file = "/run/secrets/runner.key"
client_ca_file = "/run/secrets/bekup_ca.crt"
# Client identities (URI SANs spiffe://bekup/<component>) allowed to call the
# runner (no wildcards).
allowed_client_sans = ["spiffe://bekup/serve", "spiffe://bekup/worker"]

[docker]
# Only unix:// sockets are accepted.
host = "unix:///var/run/docker.sock"
# Group that owns the Docker socket (0 = do not add a group). Example: 998.
gid = 0
# ID or name of the runner's own container, used to join the per-run networks.
# Empty = auto-detect from the container hostname (so do not set `hostname:`
# in compose). Example: "bekup-runner-1".
self_container = ""
# Limits applied to every dump/restore container.
memory_mib = 1024
cpus = 1.0
pids_limit = 256
pull_timeout = "10m"

[images]
# Optional extra allowlisted images (pinned by digest) on top of the embedded
# catalog. Empty = embedded catalog only.
extra_file = ""

[targets]
# Target allowlist. Empty allow lists deny everything. Loopback, link-local
# and cloud metadata addresses are always denied; 0.0.0.0/0 is rejected.
allow_cidrs = ["10.20.0.0/16"] # example
allow_hosts = ["db.internal.example.com"] # example
deny_cidrs = []
deny_hosts = []

[limits]
max_concurrent_runs = 4
max_run_duration = "12h"
max_log_lines = 10000
# Longer log lines are truncated.
max_log_line_bytes = 4096
