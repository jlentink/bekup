# pnpm 11 reads its settings from this file (not from .npmrc).
# Single-package workspace: the web UI.
packages:
  - .

# Pin exact versions on `pnpm add` (D-061 supply chain).
saveExact: true
# Refuse versions published less than 3 days ago (matches the Renovate policy, D-065).
minimumReleaseAge: 4320
# No dependency may run install scripts unless explicitly allowed here.
strictDepBuilds: true
allowBuilds:
  esbuild: false
# eslint-plugin-jsx-a11y 6.10.2 has not declared ESLint 10 support yet but works
# with the flat config; remove once it ships a release that lists ^10.
peerDependencyRules:
  allowedVersions:
    eslint-plugin-jsx-a11y>eslint: "10"
# GHSA-g3hv-75wg-m249 (minimatch globparts amplification DoS): only 11.0.1+
# is fixed, and the 3.x/10.x lines get no backport. Every consumer here is dev
# tooling (eslint, @eslint/config-array, typescript-estree, graphql-config) and
# uses only `minimatch()` / `new Minimatch().match()`, which 11 keeps.
# eslint-plugin-jsx-a11y 6.10.2 still default-imports minimatch 3 (a CJS
# function); the patch below switches it to the named export. Remove both once
# the dependents ship minimatch >= 11.0.1 themselves.
overrides:
  minimatch: 11.0.2
patchedDependencies:
  eslint-plugin-jsx-a11y@6.10.2: patches/eslint-plugin-jsx-a11y@6.10.2.patch
