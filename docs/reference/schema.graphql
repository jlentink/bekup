# Subscriptions (tasks 1.10 and 2.13, D-050, D-105). Subscriptions run only
# as Server-Sent Events: POST /graphql with Content-Type application/json and
# Accept: text/event-stream, one subscription per request (graphql-sse,
# distinct connections mode); the caller is the session of the cookie sent
# with that request. When the server ends a stream it sends a final error
# event whose extensions.code is UNAUTHENTICATED (the session ended),
# FORBIDDEN (its access changed), SESSION_ROTATED (it was rotated: open the
# stream again) or UNAVAILABLE (shutdown or a failed session check: retry
# later), then the complete event. Every event is re-authorized when it is
# delivered.

#
# Stream budget (D-197): a session may hold graphql.stream_max_per_session
# streams (default 4). The web client keeps one accountEvents stream per
# browser (shared across tabs) and at most one page stream per tab.

type Subscription {
  """
  The account stream: changes to your own sessions (one revoked or
  rotated, or all of them revoked) and new notifications of your own
  inbox, in one stream. Each event sets exactly one of its fields and is
  re-loaded for this stream's account and re-authorized when it is
  delivered. When a session change ends the session of this stream, the
  stream ends with its final error event (see above) and the notice may
  not arrive first. Without the notification service only session events
  arrive.
  """
  accountEvents: AccountEvent! @authenticated

  """
  The dashboard stream: changes of every run you may view (like
  runUpdated without a filter) and of every restore you may view (like
  restoresUpdated), in one stream. Each event sets exactly one of its
  fields and is re-loaded and re-authorized when it is delivered (backup
  owners receive their jobs' runs and restores at that moment only).
  Events are coalesced per run and per restore, as in the single streams.
  """
  activityUpdated: ActivityEvent! @hasRole(roles: [ADMIN, MAINTAINER, USER])
}

"One event of accountEvents: exactly one field is set."
type AccountEvent {
  "A change to one or all of your sessions."
  session: SessionEvent
  "A new notification of your inbox."
  notification: Notification
}

"One event of activityUpdated: exactly one field is set."
type ActivityEvent {
  "A run changed (its state at delivery)."
  run: Run
  "A restore changed or was created (its state at delivery)."
  restore: Restore
}

"What happened to a session."
enum SessionEventKind {
  "The session ended (logout, revoked, replaced by a new login)."
  REVOKED
  "The session was replaced by a new one (privilege change)."
  ROTATED
  "All of your sessions ended (password, role or status change)."
  ALL_REVOKED
}

"A change to one or all of your sessions. Carries identifiers only."
type SessionEvent {
  kind: SessionEventKind!
  "The session that changed; null when all sessions were revoked."
  sessionId: UUID
  "True when the change concerns the session of this stream."
  current: Boolean!
}
# Scheduled test restores (task 4.6). A job may designate a scratch target
# connection (permanent, the job's engine): bekup regularly restores the
# job's newest verified backup into a new database bekup_test_<id> there,
# compares it with the backup's source statistics (object counts exactly;
# PostgreSQL row counts exactly; MySQL/MariaDB row counts are estimates
# and only warn) and always drops the scratch database again. Changing the
# settings needs an admin or maintainer with a fresh passkey or
# authenticator check (the scratch target receives a copy of the job's
# data); backup owners see the settings and results of their jobs.
# Designating a target probes its role (D-068, D-170): a privileged or
# unknown role needs an admin and acknowledgePrivilegedTarget, and the
# worker re-probes the target before every test restore.

"The test-restore settings of a job."
