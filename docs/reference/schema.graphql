}

extend type Query {
  """
  Runs, newest first; backup owners see the runs of their own jobs only.
  `first` is 1..200 (default 50); `after` is the `endCursor` of the
  previous page.
  """
  runs(filter: RunFilter, first: Int, after: String): RunConnection! @hasRole(roles: [ADMIN, MAINTAINER, USER])

  """
  One run; null when it does not exist (admins and maintainers). Backup
  owners get FORBIDDEN for runs of other jobs and for unknown ids.
  """
  run(id: UUID!): Run @hasRole(roles: [ADMIN, MAINTAINER, USER])

  """
  The log of a run in order, after `afterId` (default: from the start);
  `first` is 1..1000 (default 200). Same access as `run`.
  """
  runLogs(runId: UUID!, afterId: ID, first: Int): RunLogPage @hasRole(roles: [ADMIN, MAINTAINER, USER])

  """
  The backup browser: stored objects, newest first; backup owners see the
  artifacts of their own jobs only. `first` is 1..200 (default 50).
  """
  artifacts(filter: ArtifactFilter, first: Int, after: String): ArtifactConnection! @hasRole(roles: [ADMIN, MAINTAINER, USER])
}

extend type Mutation {
  """
  Cancels a queued or running backup run (admins and maintainers; audited).
  The dump container is killed and no partial object is finalized. A
  finished run whose job waits for a retry gets that retry canceled
  (`retryCanceled`). CONFLICT when the run already finished otherwise.
  """
  cancelRun(id: UUID!): RunCancellation! @hasRole(roles: [ADMIN, MAINTAINER])
}

extend type Subscription {
  """
  Live run changes (status, progress, items, artifacts): each event is the
  run re-loaded when it is delivered and authorized again (backup owners
  receive runs of the jobs they own at that moment only). Filter by `jobId`
  and/or `runId` (FORBIDDEN when you may not view that job or run); without
  a filter you receive every run you may view. Events are coalesced per
  stream: a run that changes several times while an event is pending is
  sent once (with its state at delivery), and a stream delivers at most 20
  runs per second; the rest waits (no update is lost, only merged). Streams
  count against the per-session cap (graphql.stream_max_per_session,
  default 4): open one runUpdated stream per page and filter on the client.
  """
  runUpdated(jobId: UUID, runId: UUID): Run! @hasRole(roles: [ADMIN, MAINTAINER, USER])

  """
  New log lines of a run after `afterId` (default: from the start), in
  batches of at most 200 lines. The stream completes with a `done` batch
  once the run finished and every line was delivered. Same access as
  `runLogs`, checked again for every batch.
  """
  runLogAppended(runId: UUID!, afterId: ID): RunLogBatch! @hasRole(roles: [ADMIN, MAINTAINER, USER])

  """
  The run page stream (D-197): changes of one run (as runUpdated with
  `runId`) and its new log lines after `afterLogId` (as runLogAppended),
  in one stream. Each event sets exactly one of its fields and is
  re-loaded and re-authorized when it is delivered (run.view for `run`,
  run.logs_view for `logs`). After the `done` log batch the stream sends
  the run's final state once more and completes. Needs access to both
  the run and its logs.
  """
  runActivity(runId: UUID!, afterLogId: ID): RunActivity! @hasRole(roles: [ADMIN, MAINTAINER, USER])
}

"One event of runActivity: exactly one field is set."
type RunActivity {
  "The run changed (its state at delivery)."
  run: Run
  "New log lines (the last batch has done set)."
  logs: RunLogBatch
}
# Schema version per database (D-210). A job may capture the schema
# (migration) version of every database it backs up: a preset for a common
# migration framework (fixed, reviewed SQL kept in bekup) or a custom
# query (a single SELECT or WITH statement, at most 2 KiB). The runner reads
# it in the dump's statistics transaction (PostgreSQL: the snapshot the dump
# uses), read-only and with statement and lock time limits. A failed capture
# is a warning (version_unavailable, version_invalid) and never fails the
# backup. Admins and maintainers change the setting; a custom query needs a
# fresh step-up (it runs on the target with the backup role's rights).
# Every change is audited (job.version_query_changed, with a digest of a
# custom query, never the query).

"How a job captures the schema version of its databases."
enum SchemaVersionMode {
  "No capture (the default)."
  NONE
  "A preset for a migration framework."
  PRESET
  "A custom SELECT or WITH query."
  CUSTOM
}

"The outcome of a schema-version capture."
enum SchemaVersionStatus {
  "A version was captured."
  OK
  "No version: the table does not exist, has no row or the value is empty."
  NONE
  "The query failed (missing privilege, time limit, unexpected table layout or error)."
  UNAVAILABLE
  "The result was longer than 64 characters or not printable ASCII."
  INVALID
}

"A job's schema-version capture."
type JobSchemaVersion {
  mode: SchemaVersionMode!
  "The preset name (PRESET only)."
  preset: String
  "The preset's display name (PRESET only)."
  presetLabel: String
  "PostgreSQL schema of the preset's table."
  schema: String!
  "The custom query (CUSTOM only). Admins and maintainers only (null for backup owners)."
  customSql: String
}

"A fixed version query for one migration framework."
type SchemaVersionPreset {
  "The name stored on the job."
  name: String!
  label: String!
  "What the captured version is."
  description: String!
  "The framework table on PostgreSQL."
  postgresTable: String!
  "The framework table on MySQL and MariaDB."
  mysqlTable: String!
  engines: [DatabaseEngine!]!
}

"A job's new schema-version capture."
input JobSchemaVersionInput {
  mode: SchemaVersionMode!
  "Required for PRESET."
  preset: String
  "PostgreSQL schema of the preset's table (PRESET only; default public)."
  schema: String
  "Required for CUSTOM: a single SELECT or WITH statement, at most 2048 bytes. PostgreSQL tables must be schema-qualified."
  customSql: String
}

extend type Job {
  "The schema-version capture (D-210)."
  schemaVersion: JobSchemaVersion!
}

extend type RunItem {
  "The schema version captured for this database (status OK only)."
  schemaVersion: String
  "The outcome of the capture; null when the job captures none or the dump did not complete."
  schemaVersionStatus: SchemaVersionStatus
}

extend type Query {
  "The schema-version presets, in display order."
  schemaVersionPresets: [SchemaVersionPreset!]! @hasRole(roles: [ADMIN, MAINTAINER])
}

extend type Mutation {
  """
  Changes a job's schema-version capture (audited). A custom query
  requires a step-up within the last 5 minutes (STEP_UP_REQUIRED
  otherwise); turning the capture off or choosing a preset does not.
  """
  setJobSchemaVersion(jobId: UUID!, input: JobSchemaVersionInput!): Job! @hasRole(roles: [ADMIN, MAINTAINER])
