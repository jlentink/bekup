}

"The events a shared channel receives from one job; both empty: every non-security event."
input NotificationFilterInput {
  groups: [NotificationGroup!]
  "Event types of the catalog (job events only)."
  events: [String!]
}

"Filters of your inbox; unset fields do not filter."
input NotificationInboxFilter {
  "Only unread notifications."
  unreadOnly: Boolean
  "Only events of this group (notices have no group)."
  group: NotificationGroup
  "Only these event types (catalog types or notice.webhook_disabled; at most 64). With `group`, both must match."
  events: [String!]
}

"The result of a test send. Codes and messages are fixed; the receiver's response is never shown."
type NotificationTestResult {
  ok: Boolean!
  """
  The failure code (ok on success), e.g. http_status, redirect, tls,
  not_allowed, unreachable. Personal webhook tests only answer ok,
  not_allowed or failed.
  """
  code: String
  message: String
  "The receiver's HTTP status, when it answered (shared channels only; never for personal webhook tests)."
  statusCode: Int
}

"One of your personal webhooks."
type PersonalWebhook {
  id: UUID!
  label: String!
  "Scheme, host and port of the URL."
  displayUrl: String!
  state: NotificationChannelState!
  createdAt: Time!
}

"A personal webhook with its new signing key (shown once)."
type PersonalWebhookWithKey {
  webhook: PersonalWebhook!
  "The HMAC signing key. Shown only now."
  signingKey: String!
}

"Your own notification channels."
type MyNotificationChannels {
  "Your e-mail address (the e-mail channel)."
  email: String!
  "False: e-mail notifications are skipped; verify with requestEmailVerification."
  emailVerified: Boolean!
  emailVerifiedAt: Time
  webhooks: [PersonalWebhook!]!
  "The most personal webhooks you may have (5)."
  maxWebhooks: Int!
}

"One notification of your in-app inbox."
type Notification {
  id: UUID!
  "The event type (or notice.webhook_disabled)."
  type: String!
  "The event's group (null for notices)."
  group: NotificationGroup
  severity: NotificationSeverity!
  title: String!
  body: String!
  "A link into the UI."
  link: String
  "The minimal event data (job id/name, run id, status, ...); never secrets."
  data: JSON
  createdAt: Time!
  readAt: Time
}

type NotificationConnection {
  edges: [NotificationEdge!]!
  pageInfo: PageInfo!
}

type NotificationEdge {
  cursor: String!
  node: Notification!
}

type MarkNotificationsReadResult {
  "How many notifications changed to read."
  marked: Int!
  "Your remaining unread notifications."
  unreadCount: Int!
}

extend type Query {
  "The shared channels with their job attachments."
  sharedChannels: [SharedChannel!]! @hasRole(roles: [ADMIN])

  "The event catalog, grouped, filtered to the events your role can receive."
  notificationCatalog: [NotificationEventGroup!]! @authenticated

  "Your effective preference matrix (event × channel) with per-job overrides."
  myNotificationPreferences: NotificationPreferences! @authenticated

  "Your e-mail address and personal webhooks."
  myNotificationChannels: MyNotificationChannels! @authenticated

  """
  Your inbox, newest first. `first` is 1..200 (default 50); `after` is the
  `endCursor` of the previous page. `unreadOnly` is the same as
  `filter.unreadOnly` (either one set is enough).
  """
  notifications(unreadOnly: Boolean, filter: NotificationInboxFilter, first: Int, after: String): NotificationConnection! @authenticated

  unreadNotificationCount: Int! @authenticated
}

extend type Mutation {
  "Creates a shared channel (audited). A webhook's signing key is returned once."
  createSharedChannel(input: CreateSharedChannelInput!): SharedChannelWithKey! @hasRole(roles: [ADMIN]) @stepUp

  "Changes a shared channel (audited)."
  updateSharedChannel(id: UUID!, input: UpdateSharedChannelInput!): SharedChannel! @hasRole(roles: [ADMIN]) @stepUp

  "Replaces a shared webhook's signing key; the new key is returned once."
  rotateSharedChannelKey(id: UUID!): SharedChannelWithKey! @hasRole(roles: [ADMIN]) @stepUp

  "Deletes a shared channel with its job attachments."
  deleteSharedChannel(id: UUID!): Boolean! @hasRole(roles: [ADMIN]) @stepUp

  "Turns a shared channel on (also after an auto-disable; failure counters start afresh)."
  enableSharedChannel(id: UUID!): SharedChannel! @hasRole(roles: [ADMIN])

  "Turns a shared channel off."
  disableSharedChannel(id: UUID!): SharedChannel! @hasRole(roles: [ADMIN])

  "Sends a test delivery (rate limited; one per request)."
  testSharedChannel(id: UUID!): NotificationTestResult! @hasRole(roles: [ADMIN])

  "Attaches a shared channel to a job, or replaces the filter of an existing attachment."
  attachSharedChannel(jobId: UUID!, channelId: UUID!, filter: NotificationFilterInput): SharedChannel! @hasRole(roles: [ADMIN])

  "Detaches a shared channel from a job."
  detachSharedChannel(jobId: UUID!, channelId: UUID!): SharedChannel! @hasRole(roles: [ADMIN])

  """
  Adds a personal webhook (at most 5; https, must pass the SSRF guard).
  The signing key is returned once.
  """
  addMyWebhook(url: String!, label: String!): PersonalWebhookWithKey! @authenticated @stepUp

  "Replaces the signing key of one of your webhooks; the new key is returned once."
  rotateMyWebhookKey(id: UUID!): PersonalWebhookWithKey! @authenticated @stepUp

  "Deletes one of your webhooks."
  deleteMyWebhook(id: UUID!): Boolean! @authenticated @stepUp

  """
  Sends a test delivery to one of your webhooks (rate limited; one per
  request; also while it is disabled). The result is only ok, not_allowed
  or failed, without the HTTP status.
  """
  testMyWebhook(id: UUID!): NotificationTestResult! @authenticated

  "Turns one of your webhooks on again after it was auto-disabled (failure counters start afresh)."
  reenableMyWebhook(id: UUID!): PersonalWebhook! @authenticated

  """
  Sets your preference for an event and channel, per event or (jobId) as
  an override for one job you may see. Mandatory security channels (INBOX,
  EMAIL) cannot be changed: VALIDATION.
  """
  setNotificationPreference(event: String!, channel: NotificationChannelType!, enabled: Boolean!, jobId: UUID): NotificationEventPreference! @authenticated

  "Resets your preferences to the defaults, or (jobId) removes the overrides of one job."
  resetNotificationPreferences(jobId: UUID): NotificationPreferences! @authenticated

  "Marks notifications read: the given ids (at most 200) or all."
  markNotificationsRead(ids: [UUID!], all: Boolean): MarkNotificationsReadResult! @authenticated

  """
  Deletes one of your notifications. Security notifications
  (security.account, security.system) cannot be deleted, only marked read
  (VALIDATION).
  """
  deleteNotification(id: UUID!): Boolean! @authenticated
}

# Restores (task 4.5, D-167). Admins and maintainers restore into any
# connection with the backup's engine (admins also into temporary restore
# connections); backup owners only into the databases their own jobs back
# up, or into a new database on the connections their jobs use. Every
# restore needs a fresh passkey (with user verification) or authenticator
# code check (≤ 5 minutes, also with a password step-up done); accounts
# without a second factor get REQUIRES_2FA_ENROLLMENT. Overwrites are
# confirmed by typing the database name, globals restores by a phrase.
# Error texts are fixed, sanitized messages chosen by bekup. Restores into
# a connection whose role is privileged (or unknown) need an admin and an
# explicit acknowledgement (task 4.8, D-068).

"How a restore writes its target database."
enum RestoreMode {
  "Create a new database and restore into it (fails when it exists)."
  NEW_DB
  """
  Replace an existing database. PostgreSQL: restored into a temporary
  database and swapped in by renaming; MySQL/MariaDB: dropped and restored
  in place (see the preview warnings).
  """
  OVERWRITE
}

"Status of a restore."
enum RestoreStatus {
  "Waiting for a worker or a concurrency slot."
  QUEUED
  "Downloading the backup to the scratch volume."
  STAGING
  "Checking the staged backup against its record and signed manifest."
  VERIFYING
  "Streaming the verified dump into the target."
  RESTORING
  SUCCEEDED
  FAILED
  CANCELED
}

"The connection a restore writes to (non-secret identity only)."
type RestoreTargetRef {
  id: UUID!
  name: String!
  engine: DatabaseEngine!
  temporary: Boolean!
  deleted: Boolean!
}

"A warning recorded by a restore (stable code and fixed text)."
type RestoreOutcomeWarning {
  code: String!
  message: String!
}

"A restore of a backup artifact."
type Restore {
  id: UUID!
  job: RunJobRef!
  artifactId: UUID!
  runId: UUID!
  "DATABASE or GLOBALS."
  kind: RunItemKind!
  "The backed-up database (null for globals)."
  sourceDatabase: String
  target: RestoreTargetRef!
  "The database written (null for globals)."
  targetDatabase: String
  "Null for globals restores."
  mode: RestoreMode
  "PostgreSQL: object owners restored (pg_restore without --no-owner)."
  keepOwners: Boolean!
  status: RestoreStatus!
  "The user who requested it; admins and maintainers only (null for backup owners)."
  requestedBy: RunActor
  createdAt: Time!
  startedAt: Time
  finishedAt: Time
  durationSeconds: Float
  "Bytes of the verified local copy."
  stagedBytes: Float!
  errorCode: String
  errorMessage: String
  warnings: [RestoreOutcomeWarning!]!
  logLines: Int!
  logLinesDropped: Int!
  updatedAt: Time!
}

"A page of restores."
type RestoreConnection {
  edges: [RestoreEdge!]!
  pageInfo: PageInfo!
}

type RestoreEdge {
  cursor: String!
  node: Restore!
}

"Filters for restores; unset fields do not filter."
input RestoreFilter {
  jobId: UUID
  artifactId: UUID
  targetConnectionId: UUID
  status: RestoreStatus
}

"A page of restore log lines in order (redacted and sanitized when written)."
type RestoreLogPage {
  restoreId: UUID!
  lines: [RunLogLine!]!
  "The id of the last line (the afterId for the next page); afterId when there are no lines."
  endId: ID
  hasMore: Boolean!
  "Lines dropped because the restore exceeded the log caps."
  dropped: Int!
}

"Where an artifact came from (verified against its signed manifest)."
type RestoreSource {
  artifactId: UUID!
  jobId: UUID!
  runId: UUID!
  kind: RunItemKind!
  database: String
  engine: DatabaseEngine!
  "Catalog key of the backed-up server's release series."
  versionKey: String!
  serverVersion: String!
  "The restore needs the job's age identity (recipient-encrypted backup)."
  needsIdentity: Boolean!
}

"A connection the caller may restore an artifact to."
type RestoreTarget {
  id: UUID!
  name: String!
  engine: DatabaseEngine!
  versionKey: String!
  "The connection the artifact's job backs up."
  original: Boolean!
  "A temporary restore connection (admins only)."
  temporary: Boolean!
  expiresAt: Time
  ready: Boolean!
  notReadyReason: String
  insecureTransport: Boolean!
  "A new database may be created (database backups)."
  newDatabaseAllowed: Boolean!
  "Only the databases your own jobs back up may be overwritten (backup owners)."
  existingRestricted: Boolean!
}

"The connections an artifact may be restored to."
type RestoreTargets {
  source: RestoreSource!
  targets: [RestoreTarget!]!
}

"The existing databases of one restore target the caller may overwrite."
type RestoreTargetDatabases {
  target: RestoreTarget!
  """
  Existing databases (backup owners: only those their jobs back up),
  without bekup's temporary restore databases.
  """
  databases: [String!]!
  "The runner's warning codes."
  warnings: [String!]!
  "The privilege verdict on the target connection's role (read with the list)."
  targetPrivileges: TargetPrivileges!
  "When the list was read from the server (it is cached for 30 seconds)."
  listedAt: Time!
}

"Something to know before a restore (stable code, fixed text)."
type RestoreWarning {
  code: String!
  message: String!
}

"The checked restore request: what will happen, the warnings and the confirmation text."
type RestorePreview {
  source: RestoreSource!
  target: RestoreTarget!
  "Null for globals restores."
  mode: RestoreMode
  "Null for globals restores."
  targetDatabase: String
  warnings: [RestoreWarning!]!
  """
  What must be typed to confirm: the database name for OVERWRITE
  (confirmTargetName), the phrase for a globals restore (confirmPhrase);
  null when no confirmation is needed.
  """
  confirmText: String
  """
  The privilege verdict on the target connection's role (D-068; read
  through the runner, cached for 30 seconds; the request checks again).
  When acknowledgementRequired, only admins may restore, with
  acknowledgePrivilegedTarget.
  """
  targetPrivileges: TargetPrivileges!
  "The target is not the connection the backup was taken from (also recorded in the audit entry)."
  crossSource: Boolean!
}

"A database restore request."
input RestoreArtifactInput {
  "A DATABASE artifact (present, verified, covered by a signed manifest)."
  artifactId: UUID!
  targetConnectionId: UUID!
  mode: RestoreMode!
  "The database to create (NEW_DB) or replace (OVERWRITE)."
  targetDatabase: String!
  "OVERWRITE: must equal targetDatabase exactly."
  confirmTargetName: String
  "PostgreSQL only: restore the object owners (default: objects belong to the target connection's role)."
  keepOwners: Boolean
  """
  The job's age identity (AGE-SECRET-KEY-1...) for recipient-encrypted
  backups only. It is stored sealed until the restore starts and never
  logged, audited or returned.
  """
  ageIdentity: String
  """
  Required (admins only) when the target connection's role is privileged
  or its privileges are unknown (D-068): SQL in the backup runs with that
  role's rights. Audited and raised as a security alert.
  """
  acknowledgePrivilegedTarget: Boolean
}

"A restore request to check (restorePreview)."
input RestorePreviewInput {
  artifactId: UUID!
  targetConnectionId: UUID!
  "Required for DATABASE artifacts, not allowed for GLOBALS."
  mode: RestoreMode
  "Required for DATABASE artifacts, not allowed for GLOBALS."
  targetDatabase: String
  keepOwners: Boolean
}

"A PostgreSQL globals restore request (admins only)."
input RestoreGlobalsInput {
  "A GLOBALS artifact."
  artifactId: UUID!
  "A PostgreSQL connection."
  targetConnectionId: UUID!
  "Must equal the preview's confirmText: `restore globals into <connection name>`."
  confirmPhrase: String!
  "Required when the target connection's role is privileged or unknown (D-068; usually the case for globals)."
  acknowledgePrivilegedTarget: Boolean
}

"An accepted cancelRestore."
type RestoreCancellation {
  restoreId: UUID!
  jobId: UUID!
  """
  CANCELED when the restore had not started; otherwise its current status
  until its worker stops it (it then ends as CANCELED).
  """
  status: RestoreStatus!
  requestedAt: Time!
}

extend type Query {
  """
  The connections an artifact may be restored to (same engine as the
  backup; backup owners: the connections their jobs back up; admins also
  see temporary restore connections). Globals backups: admins only.
  """
  restoreTargets(artifactId: UUID!): RestoreTargets! @hasRole(roles: [ADMIN, MAINTAINER, USER])

  """
  The existing databases of one restore target, read through the runner
  (cached for 30 seconds; one runner call per request, so it must be the
  only field of its operation).
  """
  restoreTargetDatabases(artifactId: UUID!, targetConnectionId: UUID!): RestoreTargetDatabases! @hasRole(roles: [ADMIN, MAINTAINER, USER])

  """
  Checks a restore request without running it (target rules, engine,
  names; no second-factor check) and returns the warnings to show, the
  target role's privilege verdict and the text to type for the
  confirmation. It reads the target through the runner (cached for 30
  seconds), so it must be the only field of its operation.
  """
  restorePreview(input: RestorePreviewInput!): RestorePreview! @hasRole(roles: [ADMIN, MAINTAINER, USER])

  """
  Restores, newest first; backup owners see the restores of their own
  jobs only. `first` is 1..200 (default 50).
  """
  restores(filter: RestoreFilter, first: Int, after: String): RestoreConnection! @hasRole(roles: [ADMIN, MAINTAINER, USER])

  """
  One restore; null when it does not exist (admins and maintainers).
  Backup owners get FORBIDDEN for other jobs' restores and unknown ids.
  """
  restore(id: UUID!): Restore @hasRole(roles: [ADMIN, MAINTAINER, USER])

  """
  The log of a restore after `afterId` (default: from the start); `first`
  is 1..1000 (default 200). Same access as `restore`.
  """
  restoreLogs(restoreId: UUID!, afterId: ID, first: Int): RestoreLogPage @hasRole(roles: [ADMIN, MAINTAINER, USER])
}

extend type Mutation {
  """
  Queues a database restore (audited). Requires a passkey (with user
  verification) or authenticator code check within the last 5 minutes;
  STEP_UP_REQUIRED otherwise, REQUIRES_2FA_ENROLLMENT without a second
  factor. Must be the only field of its operation (it may carry an age
  identity). Show the restorePreview warnings first. A target whose role
  is privileged or unknown (restorePreview.targetPrivileges) needs an
  admin and acknowledgePrivilegedTarget: FORBIDDEN for others, VALIDATION
  without the acknowledgement.
  """
  restoreArtifact(input: RestoreArtifactInput!): Restore! @hasRole(roles: [ADMIN, MAINTAINER, USER])

  """
  Queues a PostgreSQL globals restore (roles, tablespaces) into a
  connection: admins only, fresh second factor, the exact confirmation
  phrase. It changes existing roles that are in the backup, including
  their passwords. A privileged or unknown target role (as usual for
  globals) also needs acknowledgePrivilegedTarget.
  """
  restoreGlobals(input: RestoreGlobalsInput!): Restore! @hasRole(roles: [ADMIN])

  """
  Cancels a queued or running restore (admins and maintainers; audited).
  CONFLICT when it already finished.
  """
  cancelRestore(id: UUID!): RestoreCancellation! @hasRole(roles: [ADMIN, MAINTAINER])
}

extend type Subscription {
  """
  Live changes of one restore (status, progress, log counts): each event
  is the restore re-loaded and authorized again when it is delivered, so
  a caller who loses access stops receiving events. The stream completes
  after the restore finished. Same access as `restore`.
  """
  restoreUpdated(restoreId: UUID!): Restore! @hasRole(roles: [ADMIN, MAINTAINER, USER])

  """
  Changes of every restore you may view (admins and maintainers: all;
  backup owners: their own jobs' restores), including new ones. Each event
  is the restore re-loaded and authorized again when it is delivered.
  Events are coalesced per restore and delivered at most 20 per second;
  after possibly lost events the restores changed since are re-sent. One
  stream counts against the per-session cap: open one per page.
  """
  restoresUpdated: Restore! @hasRole(roles: [ADMIN, MAINTAINER, USER])
}
# Backup runs (tasks 3.6 and 3.7; D-147, D-149). Admins and maintainers
# see every run; backup owners see the runs and artifacts of the jobs they
# own only (listings are filtered, single objects of other jobs answer
# FORBIDDEN). Sizes are bytes as Float (exact up to 2^53). Error and
# warning texts are fixed, sanitized messages chosen by bekup, never
# server output.

"Status of a backup run."
enum RunStatus {
  "Enqueued; waiting for a worker or a concurrency slot."
  QUEUED
  RUNNING
  "Every database stored and verified on every destination, with the signed manifest."
  SUCCESS
  "At least one complete, verified artifact, but something is missing (a destination, a database, the manifest)."
  PARTIAL
  "Nothing usable was stored."
  FAILED
  CANCELED
  "Not run: the job was deleted or disabled before the run started."
  SKIPPED
}

"What started a run."
enum RunTrigger {
  SCHEDULE
  "A missed scheduled run caught up after downtime."
  CATCH_UP
  "runJobNow."
  MANUAL
  "startNextRunEarly: the next planned occurrence (scheduledFor) pulled forward."
  EARLY
}

"What a run item backs up."
enum RunItemKind {
  DATABASE
  "The PostgreSQL cluster globals (roles, tablespaces)."
  GLOBALS
}

"Status of one database of a run."
enum RunItemStatus {
  RUNNING
  SUCCESS
  PARTIAL
  FAILED
  CANCELED
}

"What an artifact holds."
enum ArtifactKind {
  DATABASE
  GLOBALS
  "The signed manifest.json of the run on that destination."
  MANIFEST
}

