# Audit log (task 1.4; D-101, D-106). Admin only.

extend type Query {
  """
  The audit log, newest first. `first` is 1..200 (default 50); `after` is
  the `endCursor` of the previous page.
  """
  auditLog(filter: AuditLogFilter, first: Int, after: String): AuditLogConnection!
    @hasRole(roles: [ADMIN])

  """
  The state of the audit chain: the latest periodic verification (hourly
  incremental, daily full; D-190), the newest entry and the newest signed
  chain head. Informational: the proof is `bekup audit verify` against an
  exported signed head.
  """
  auditChainStatus: AuditChainStatus! @hasRole(roles: [ADMIN])
}

"The outcome of one completed audit chain verification."
type AuditChainVerification {
  checkedAt: Time!
  "False when a problem was found (an audit.verify.failed entry and a critical alert)."
  ok: Boolean!
  "True when the whole chain was verified, false for an incremental check of new entries."
  full: Boolean!
  "The problem found, as `<kind>:<entry id>` (e.g. `hash_mismatch:1234`); null when ok."
  finding: String
  "The newest entry known to verify (null: none yet)."
  verifiedThroughId: ID
}

"A signed audit chain head."
type AuditSignedHead {
  "The audit entry the signature covers."
  chainId: ID!
  signedAt: Time!
  "The instance signing key (fingerprint id)."
  keyId: String!
}

"The audit chain status."
type AuditChainStatus {
  "The latest verification (null: none ran yet)."
  lastVerification: AuditChainVerification
  "The newest audit entry (null: the log is empty)."
  headId: ID
  "Its chain hash (hex)."
  headHash: String
  headAt: Time
  "The newest signed chain head (null: none yet)."
  latestSignedHead: AuditSignedHead
}

"Who performed an audited action."
enum AuditActorKind {
  "A signed-in user."
  USER
  "bekup itself (scheduler, workers, startup checks)."
  SYSTEM
  "A host operator running a bekup subcommand."
  CLI
}

"Filters for auditLog; unset fields do not filter."
input AuditLogFilter {
  "Exact action name, e.g. `user.created`."
  action: String
  "Action prefix, e.g. `auth.` or `cli.admin.`."
  actionPrefix: String
  actorUserId: UUID
  actorKind: AuditActorKind
  targetType: String
  targetId: String
  "Entries at or after this time."
  from: Time
  "Entries before this time."
  to: Time
}

"A page of audit entries."
type AuditLogConnection {
  edges: [AuditLogEdge!]!
  pageInfo: PageInfo!
}

type AuditLogEdge {
  cursor: String!
  node: AuditLogEntry!
}

"One audit log entry. Details are redacted when recorded and never hold secrets."
type AuditLogEntry {
  id: ID!
  ts: Time!
  actorKind: AuditActorKind!
  actorUserId: UUID
  action: String!
  targetType: String
  targetId: String
  "Client IP address, if known."
  ip: String
  "Details as a JSON object."
  details: String!
  "The entry's chain hash (hex)."
  hash: String!
}
# Authentication: login, logout, the current user, own sessions and
# password changes (task 1.5; D-047, D-095, D-107). Second factors (tasks
# 1.7-1.9) extend LoginResult's flow.

type Mutation {
  """
  Signs in with e-mail and password and sets the session cookie (HttpOnly,
  SameSite=Strict; `__Host-` and Secure over https). Any failure answers
  UNAUTHENTICATED "invalid email or password", whatever the cause; too
  many attempts answer RATE_LIMITED. A session cookie the browser already
  had is revoked (the session is always rotated). For an account with a
  second factor the result has `secondFactorRequired: true` and the
  session can only complete it (completeSecondFactor) within 5 minutes.
  """
  login(email: String!, password: String!): LoginResult!

  "Ends the current session and clears the session cookie."
  logout: Boolean! @authenticated

  """
  Revokes one of your own sessions. Revoking the current session also
  clears the cookie. Unknown ids and other users' sessions answer
  NOT_FOUND.
  """
  revokeSession(id: UUID!): Boolean! @authenticated

  """
  Changes your password. Needs the current password (a wrong one answers
  VALIDATION on `currentPassword` and counts towards the lockout) and a
  fresh step-up (completeStepUp; a login without a second factor or the
  completed second factor of a login also count). Every
  session of your account is revoked; this browser gets a new session
  cookie.
  """
  changePassword(currentPassword: String!, newPassword: String!): Boolean! @stepUp
}

extend type Query {
  "The signed-in user."
  me: User @authenticated

  "Your active sessions, most recently used first."
  mySessions: [Session!]! @authenticated
}

"A bekup user as seen by themselves."
type User {
  id: UUID!
  email: String!
  displayName: String!
  role: Role!
}

"Kinds of second factors (tasks 1.7-1.9)."
enum SecondFactorKind {
  TOTP
  PASSKEY
  RECOVERY_CODE
}

"The result of login."
type LoginResult {
  """
  The signed-in user; null while secondFactorRequired is true (a login
  waiting for its second factor learns nothing about the account).
  """
  user: User
  """
  True when a second factor must be completed (completeSecondFactor)
  before the session can do anything but log out.
  """
  secondFactorRequired: Boolean!
  "The second factors the user can complete the login with."
  availableFactors: [SecondFactorKind!]!
}

"One of your sessions. The session token itself is never exposed."
type Session {
  id: UUID!
  createdAt: Time!
  lastSeenAt: Time!
  idleExpiresAt: Time!
  absoluteExpiresAt: Time!
  "Client IP address when the session was last used, if known."
  ip: String
  "Client User-Agent (truncated), if known."
  userAgent: String
  "Authentication assurance level: 1 password, 2 password + second factor."
  aal: Int!
  "True for the session of this request."
  current: Boolean!
}
# Job calendar (task 3.14, D-156). Read only. Admins and maintainers see
# every job; backup owners see the jobs they own only (requested job ids
# that are not visible are dropped silently). The range is at most 93 days
# and the result is bounded (see Calendar.truncated).

"What a calendar event shows."
enum CalendarEventKind {
  "A planned occurrence (paused for a disabled job, or started early)."
  PLANNED
  "A run, by status."
  RUN
  "A skipped occurrence (the reason is in `detail`)."
  SKIPPED
  """
  The earliest time retention may remove a run's copy on one destination
  (the next retention sweep at or after it removes it).
  """
  EXPIRY
}

"One calendar entry. Times are UTC."
type CalendarEvent {
  jobId: UUID!
  jobName: String!
  kind: CalendarEventKind!
  start: Time!
  "The end of a finished run (null otherwise)."
  end: Time
  "The run's status (RUN only)."
  status: RunStatus
  "What started the run (RUN only)."
  trigger: RunTrigger
  "The run (RUN, EXPIRY, and PLANNED when started early)."
  runId: UUID
  "The destination of the copy (EXPIRY only)."
  destinationId: UUID
  """
  EXPIRY only: the time depends on future runs (keep-last or the newest
  complete run, which is kept until a newer complete run exists) and
  assumes every planned run succeeds. False: exact (keep-days or Object
  Lock).
  """
  projected: Boolean!
  "PLANNED only: the job is disabled; the occurrence will not run."
  paused: Boolean!
  "PLANNED only: this occurrence was pulled forward (startNextRunEarly); `runId` is the early run."
  startedEarly: Boolean!
  """
  PLANNED only: the pending catch-up run of an enabled job whose planned time
  has passed (the scheduler runs it at its next tick, missed occurrences
  collapse into this one run); shown at the time of the query.
  """
  overdue: Boolean!
  "A fixed, bekup-chosen text (skip reason, run error code, expiry rule)."
  detail: String
}

"A calendar range."
type Calendar {
  "Events ordered by start time."
  events: [CalendarEvent!]!
  """
  A bound was hit (at most 5,000 events, 500 planned occurrences per job,
  500 jobs, and bounded loads): some events are missing. When the event cap
  is hit, the earliest 5,000 events are kept (a time prefix of the range).
  Narrow the range or the jobs.
  """
  truncated: Boolean!
  from: Time!
  to: Time!
  "The requested IANA zone, echoed for day bucketing (times stay UTC)."
  timezone: String!
}

extend type Query {
  """
  The job calendar for [from, to): at most 93 days, `timezone` an IANA
  zone name, `jobIds` (at most 500; null: every visible job) narrows the
  jobs. Planned occurrences start at the later of `from` and now.
  """
  calendar(from: Time!, to: Time!, timezone: String!, jobIds: [UUID!]): Calendar! @hasRole(roles: [ADMIN, MAINTAINER, USER])
}
# Runtime config reload (task 6.13, D-200). Admin only.
#
# Every serve and worker process re-reads its own bekup.toml (the file it
# loaded at startup) on request, applies only the keys that are safe to
# change without a restart ("live" keys) and reports changed keys that
# still need a restart. An unreadable or invalid file never replaces the
# running configuration. Only key names and an error kind are ever shown:
# never values and never the file path (details are in the server log).

"The outcome of a reload in one process."
enum ConfigReloadStatus {
  "The process started with this configuration (no reload yet)."
  LOADED
  "Live keys changed and were applied."
  APPLIED
  "The file matches the running configuration."
  UNCHANGED
  "Keys changed that need a restart (live keys, if any, were applied)."
  RESTART_REQUIRED
  "The file could not be read or is invalid; nothing changed."
  REJECTED
  "A change could not be applied or recorded; nothing changed."
  FAILED
}

"""
Why a reload was rejected or failed. (An outcome that could not be
recorded, database unavailable, is never stored: it is only in the
process's log and metrics.)
"""
enum ConfigReloadErrorKind {
  "The file is missing, unreadable or fails the ownership/mode checks."
  FILE
  "The file is not valid TOML."
  SYNTAX
  "A key is unknown or a value is invalid (see errorKeys)."
  INVALID
  "A component refused the new values."
  APPLY
}

"What started a reload."
enum ConfigReloadTrigger {
  "An admin's reloadConfig (every process)."
  UI
  "SIGHUP to one process."
  SIGNAL
}

"The kind of bekup process."
enum BekupProcessKind {
  SERVE
  WORKER
}

"One process's answer to a reload request, or its startup row."
type ConfigProcessResult {
  "Random id of the process (new at every start)."
  instanceId: UUID!
  kind: BekupProcessKind!
  "Host name of the process (usually the container id)."
  hostname: String!
  "bekup version of the process."
  version: String!
  processStartedAt: Time!
  finishedAt: Time!
  "The request answered (null for the startup row)."
  requestId: UUID
  "What started the answered request (null for the startup row)."
  trigger: ConfigReloadTrigger
  """
  The process's LISTEN connection is up now, so it receives reload
  requests. False: the process stopped (or lost its database connection);
  its row is history and needs no action. Display only (the connection's
  application_name; D-200).
  """
  listening: Boolean!
  status: ConfigReloadStatus!
  "Set for REJECTED and FAILED."
  errorKind: ConfigReloadErrorKind
  "Live keys this reload applied (a live key this kind of process does not use is not listed)."
  appliedKeys: [String!]!
  "Changed keys that need a restart of this process."
  restartKeys: [String!]!
  "Keys named by the errors of a rejected file (unknown keys appear as `<section>.unknown_key`)."
  errorKeys: [String!]!
  "Applied keys whose change weakens security (every admin was alerted)."
  weakenedKeys: [String!]!
}

"A reload request with the answers so far."
type ConfigReloadRequest {
  id: UUID!
  requestedAt: Time!
  "The admin who asked."
  requestedBy: UUID
  trigger: ConfigReloadTrigger!
  "One entry per process that answered (poll until expectedProcesses answered)."
  results: [ConfigProcessResult!]!
  "Processes that can receive a request right now."
  listeningProcesses: Int!
  """
  Processes this request waits for: those that answered plus those
  listening now that are responsible for it (startup row at most one
  minute after the request, database time; a process started later loaded
  a newer file and never answers it; D-200).
  """
  expectedProcesses: Int!
}

"How the answering serve process connects to bekup's own database (D-207)."
enum DatabaseConfigMode {
  "Connection URL files (the bundled stack)."
  URL
  "host, port, name, user and password files (an external PostgreSQL)."
  FIELDS
  """
  One account for migrations and the app (database.single_account): an
  explicit weakening, warned at every start and alerted daily.
  """
  SINGLE_ACCOUNT
}

"""
The app database posture of the serve process that answered (restart-only
settings; no host names or credentials).
"""
type DatabasePosture {
  mode: DatabaseConfigMode!
  "database.tls_mode: verify-full, require or disable."
  tlsMode: String!
  """
  True when tls_mode is weaker than verify-full (D-100): the server identity
  is not fully verified, or the connection is not encrypted.
  """
  insecureTransport: Boolean!
  "True in single-account mode (D-207)."
  singleAccount: Boolean!
}

"""
How the bekup image of the serve process that answered is referenced
(D-212; versions only).
"""
type ImagePosture {
  """
  True when the image follows a tag such as :latest instead of a digest
  (BEKUP_IMAGE_MODE=following, or the runner reports that its own container
  image has no digest; the latter can turn true after startup): an explicit
  weakening, warned, audited and alerted daily.
  """
  following: Boolean!
  """
  The version bekup setup prepared the deployment for (BEKUP_SETUP_VERSION;
  null when not set): processes of another version refuse to start.
  """
  setupVersion: String
  "The version of the serve process that answered."
  version: String!
}

"The configuration page."
type ConfigStatus {
  "The app database posture of the serve process that answered."
  database: DatabasePosture!
  "The image posture of the serve process that answered (D-212)."
  image: ImagePosture!
  "Keys a reload applies without a restart (`section.key`)."
  liveKeys: [String!]!
  """
  The newest row of every process listening now (any age) and of every
  process seen in the last 7 days, newest first (at most 100).
  """
  processes: [ConfigProcessResult!]!
  "Processes that can receive a reload request right now."
  listeningProcesses: Int!
  "The newest reload request (null: none yet)."
  lastRequest: ConfigReloadRequest
}

extend type Query {
  "Live keys, processes and the newest reload request."
  configStatus: ConfigStatus! @hasRole(roles: [ADMIN])
  "One reload request with its answers (NOT_FOUND for an unknown id)."
  configReloadRequest(id: UUID!): ConfigReloadRequest! @hasRole(roles: [ADMIN])
}

extend type Mutation {
  """
  Asks every serve and worker process to reload bekup.toml. Audited
  (config.reload_requested; each process records config.reloaded or
  config.reload_failed). Returns the request with the answer of the
  process that took it; poll configReloadRequest for the others.
  RATE_LIMITED when a reload was requested less than 10 seconds ago. A
  change that weakens security raises a security alert to every admin.
  """
  reloadConfig: ConfigReloadRequest! @hasRole(roles: [ADMIN]) @stepUp
}
# Database connections (task 2.11; D-106, D-132, D-133, D-135). Admins
# manage them; every change needs a fresh step-up and is audited.
# Maintainers see metadata only (name, engine, version, host, port, TLS mode,
# pin status and expiry, SSH enabled; `settings` is null for them) and may
# test connections and list their databases. Credentials are write-only:
# inputs accept new values, outputs only tell whether one is stored.
#
# serve never connects to a database: tests, version detection, database
# listing, image pre-pulls, certificate and host-key captures all run on the
# runner. Certificate pins and SSH host keys are never trusted
# automatically: fetch, compare out of band, confirm (step-up). A target
# whose certificate no longer matches the pin answers TLS_PIN_MISMATCH, a
# bastion with another host key SSH_HOST_KEY_MISMATCH (both audited and
# alerted). Other target failures answer CONNECTION_FAILED with a fixed
# message (testConnection reports them in its result instead).

"Database engines. MySQL and MariaDB are separate engines."
enum DatabaseEngine {
  POSTGRES
  MYSQL
  MARIADB
}

"Transport security towards the database server."
enum ConnectionTlsMode {
  "TLS verified against the pinned certificate only (the default)."
  PINNED
  "TLS without verification (insecure: audited opt-out)."
  UNVERIFIED
  "No TLS (insecure: audited opt-out)."
  DISABLED
}

"State of a connection's certificate pin."
enum TlsPinStatus {
  "The TLS mode is not PINNED."
  NOT_REQUIRED
  "PINNED without a confirmed pin: the connection cannot be used."
  MISSING
  VALID
  EXPIRES_WITHIN_30_DAYS
  EXPIRES_WITHIN_7_DAYS
  EXPIRED
}

"The credential the SSH tunnel authenticates with."
enum ConnectionSshAuthMethod {
  NONE
  PASSWORD
  PRIVATE_KEY
}

"A database connection."
type Connection {
  id: UUID!
  name: String!
  engine: DatabaseEngine!
  "Image catalog key of the server's release series (e.g. 17, 8.4, 11.8)."
  versionKey: String!
  "The version or client image is an end-of-life series."
  legacyVersion: Boolean!
  host: String!
  port: Int!
  tlsMode: ConnectionTlsMode!
  "Badge: TLS is not pinned (UNVERIFIED or DISABLED)."
  insecureTransport: Boolean!
  pinStatus: TlsPinStatus!
  "Expiry of the current pin (the earliest of the confirmed certificates)."
  pinExpiresAt: Time
  sshEnabled: Boolean!
  "True when the connection can be used (pin and, with SSH, host key and credential present)."
  ready: Boolean!
  "What is missing when not ready."
  notReadyReason: String
  """
  The connection's own limit of concurrent runs; null uses the global
  workers.max_runs_per_connection (task 3.13). Backups and restores share
  this limit (a limit of 1 makes a restore wait behind a running backup).
  The stored value may exceed a since lowered workers.max_concurrent_runs;
  effectiveMaxConcurrentRuns shows the clamped value, and the global cap is
  always enforced when a run takes its slot.
  """
  maxConcurrentRuns: Int
  """
  The limit that applies: maxConcurrentRuns or the global default, clamped
  to workers.max_concurrent_runs. Runs beyond it wait for a slot.
  """
  effectiveMaxConcurrentRuns: Int!
  createdAt: Time!
  updatedAt: Time!
  "The full non-secret configuration. Admins only: null for maintainers."
  settings: ConnectionSettings
  """
  A temporary restore connection (task 4.4): admin only, usable only as a
  restore target, deleted with its credentials destroyed at expiresAt or
  once the restores that used it have finished.
  """
  temporary: Boolean!
  "When a temporary connection expires; null for permanent connections."
  expiresAt: Time
  """
  The newest stored testConnection result (D-187); null when never tested.
  Normalized codes only.
  """
  lastTest: ConnectionLastTest
}

"The stored outcome of the newest testConnection (D-187)."
type ConnectionLastTest {
  at: Time!
  ok: Boolean!
  """
  The normalized failure code (as ConnectionTestResult.code, plus
  TLS_PIN_MISMATCH and SSH_HOST_KEY_MISMATCH); null when ok.
  """
  code: String
  "The connection's settings changed after this test."
  stale: Boolean!
  "The privilege verdict of the test's probe; null when the test failed before the check."
  privileges: TargetPrivileges
}

type ConnectionSettings {
  "Image catalog key of the client image the runner uses."
  imageKey: String!
  username: String!
  hasPassword: Boolean!
  "Public TLS client certificate (its key is stored encrypted); null when none."
  clientCertificatePem: String
  "The current certificate pin; null until confirmCertificatePin."
  tlsPin: CertificatePin
  "A staged backup pin for a planned certificate rotation."
  backupPin: CertificatePin
  "The SSH tunnel; null when the database is reached directly."
  ssh: ConnectionSshSettings
}

"A confirmed certificate pin (public data)."
type CertificatePin {
  "The anchor: a self-signed server certificate or the root CA."
  certificatePem: String!
  subject: String!
  issuer: String!
  isCa: Boolean!
  "Expected leaf SPKI SHA-256 (base64); null for a CA pin that allows leaf rotation."
  leafSpkiSha256: String
  notAfter: Time!
  pinnedAt: Time!
}

type ConnectionSshSettings {
  host: String!
  port: Int!
  user: String!
  authMethod: ConnectionSshAuthMethod!
  hasPassword: Boolean!
  hasPrivateKey: Boolean!
  hasPassphrase: Boolean!
  "The authorized_keys line of the stored private key (install it on the bastion)."
  publicKey: String
  "The pinned host key; null until confirmSshHostKey."
  hostKey: SshHostKey
}

"An allowlisted engine version of the image catalog."
type EngineVersion {
  engine: DatabaseEngine!
  key: String!
  "The client version of the pinned image."
  clientVersion: String!
  legacy: Boolean!
}

"The result of testConnection: normalized codes and fixed messages only."
type ConnectionTestResult {
  ok: Boolean!
  "Failure code (e.g. TARGET_UNREACHABLE, TARGET_AUTH_FAILED, INCOMPATIBLE_CLIENT)."
  code: String
  message: String
  serverVersion: String
  "Catalog key matching the server; null when no allowlisted client fits."
  detectedVersionKey: String
  "The connection's client image can back up this server."
  compatible: Boolean!
  legacy: Boolean!
  "Stable warning codes (compatibility, certificate expiry, staged pin in use)."
  warnings: [String!]!
  databaseCount: Int!
  """
  Whether the connection's role is privileged for restores (D-068); null
  when the test failed before the check.
  """
  privileges: TargetPrivileges
}

"How privileged a connection's role is (D-068): SQL in a restored dump runs with its rights."
enum TargetPrivilegeStatus {
  "No privilege enabling host access or privilege escalation was found."
  NOT_PRIVILEGED
  """
  Superuser or similar (PostgreSQL: SUPERUSER, CREATEROLE, REPLICATION,
  BYPASSRLS, server file/program roles; MySQL/MariaDB: SUPER, FILE,
  PROCESS, CREATE USER, global GRANT OPTION, admin privileges, writes to
  the mysql schema).
  """
  PRIVILEGED
  "Could not be determined completely (e.g. MySQL/MariaDB roles granted); treated as privileged."
  UNKNOWN
}

"The privilege verdict on a connection's role (D-068)."
type TargetPrivileges {
  status: TargetPrivilegeStatus!
  """
  Stable reason codes, e.g. superuser, createrole,
  member_of:pg_execute_server_program, member_of_role_with:superuser,
  global:FILE, global:ALL PRIVILEGES, proxy, system_schema_write,
  roles_granted, detection_failed.
  """
  reasons: [String!]!
  "Restores into this connection need an admin and acknowledgePrivilegedTarget (PRIVILEGED or UNKNOWN)."
  acknowledgementRequired: Boolean!
}

type ConnectionVersionInfo {
  serverVersion: String!
  "The catalog key to use as versionKey and imageKey; null when none fits."
  suggestedVersionKey: String
  legacy: Boolean!
  "The connection's current client image fits the server."
  currentCompatible: Boolean!
  warnings: [String!]!
}

type ConnectionDatabases {
  "Databases reported by the server, without the engine's system databases."
  databases: [String!]!
  warnings: [String!]!
}

type ImagePrePullResult {
  "The digest-pinned image reference."
  imageRef: String!
  alreadyPresent: Boolean!
}

"A captured certificate chain. Nothing is trusted: compare it out of band."
type CertificateChain {
  "Leaf first, as presented by the server."
  certificates: [ChainCertificate!]!
  "The certificate to pin (self-signed leaf or root CA); null when the server presented none (supply the root CA as PEM)."
  suggestedAnchorIndex: Int
  "The leaf's SPKI SHA-256 (base64): pass it to confirmCertificatePin."
  leafSpkiSha256: String!
}

type ChainCertificate {
  pem: String!
  subject: String!
  issuer: String!
  dnsNames: [String!]!
  ipAddresses: [String!]!
  notBefore: Time!
  notAfter: Time!
  isCa: Boolean!
  selfSigned: Boolean!
  "SPKI SHA-256 as base64 and hex."
  spkiSha256: String!
  spkiSha256Hex: String!
  "SHA-256 of the certificate (DER, hex)."
  fingerprintSha256: String!
}

"The public half of a generated SSH keypair; the private key is stored encrypted and never returned."
type ConnectionSshKeypair {
  connection: Connection!
  "The authorized_keys line to install on the bastion."
  publicKey: String!
  fingerprintSha256: String!
}

extend type Query {
  "Connections that are not deleted, ordered by name."
  connections: [Connection!]! @hasRole(roles: [ADMIN, MAINTAINER])

  "One connection; null when it does not exist or was deleted."
  connection(id: UUID!): Connection @hasRole(roles: [ADMIN, MAINTAINER])

  """
  The unexpired temporary restore connections, newest first (at most 200;
  the restore wizard). They never appear in connections or connection.
  """
  temporaryConnections: [Connection!]! @hasRole(roles: [ADMIN])

  "The allowlisted engine versions (image catalog) for versionKey and imageKey."
  engineVersions(engine: DatabaseEngine): [EngineVersion!]! @hasRole(roles: [ADMIN, MAINTAINER])
}

extend type Mutation {
  """
  Creates a connection (TLS mode PINNED unless set otherwise; any other
  mode is an audited opt-out). Pinned TLS to an IP address or localhost
  needs an SSH tunnel (D-132). A name already in use answers CONFLICT.
  """
  createConnection(input: CreateConnectionInput!): Connection! @hasRole(roles: [ADMIN]) @stepUp

  """
  Changes a connection. Credential fields left out keep the stored value.
  Changing the host or port removes the certificate pins; changing the
  bastion's host or port (or disableSsh) removes its host-key pin.
  """
  updateConnection(id: UUID!, input: UpdateConnectionInput!): Connection! @hasRole(roles: [ADMIN]) @stepUp

  "Soft deletes a connection (its name can be reused)."
  deleteConnection(id: UUID!): Boolean! @hasRole(roles: [ADMIN]) @stepUp

  """
  Connects with the stored credentials through the runner. Target failures
  are reported in the result; a certificate or host-key mismatch is an
  error. Rate limited; must be the only field of its operation.
  """
  testConnection(id: UUID!): ConnectionTestResult! @hasRole(roles: [ADMIN, MAINTAINER])

  "Asks the server for its version and suggests the catalog key. Rate limited; must be the only field of its operation."
  detectVersion(id: UUID!): ConnectionVersionInfo! @hasRole(roles: [ADMIN, MAINTAINER])

  "Lists the server's databases. Rate limited; must be the only field of its operation."
  listDatabases(id: UUID!): ConnectionDatabases! @hasRole(roles: [ADMIN, MAINTAINER])

  "Pulls the connection's client image on the runner (by digest). Must be the only field of its operation."
  prePullImage(id: UUID!): ImagePrePullResult! @hasRole(roles: [ADMIN, MAINTAINER])

  """
  Captures the server's TLS certificate chain through the runner without
  sending credentials. Stores and trusts nothing. Rate limited; must be
  the only field of its operation.
  """
  fetchCertificate(id: UUID!): CertificateChain! @hasRole(roles: [ADMIN])

  """
  Pins the certificate: certIndex into a fresh capture (bound to the leaf
  SPKI you compared) or a PEM supplied out of band. Confirming the staged
  backup pin promotes it. Must be the only field of its operation.
  """
  confirmCertificatePin(id: UUID!, input: CertificatePinInput!): Connection! @hasRole(roles: [ADMIN]) @stepUp

  "Stages a backup pin for a planned certificate rotation (needs a current pin). Must be the only field of its operation."
  stageBackupPin(id: UUID!, input: CertificatePinInput!): Connection! @hasRole(roles: [ADMIN]) @stepUp

  """
  Trust on first use: the runner connects to the SSH bastion and returns
  the host key it presents, without authenticating. Compare the
  fingerprint out of band before confirming it. Rate limited; must be the
  only field of its operation.
  """
  fetchSshHostKey(id: UUID!): SshHostKey! @hasRole(roles: [ADMIN])

  """
  Pins the SSH bastion's host key (an authorized_keys line).
  expectedHost/expectedPort are the bastion the key was fetched from
  (SshHostKey.host/port); CONFLICT if the bastion changed since.
  """
  confirmSshHostKey(id: UUID!, authorizedKey: String!, expectedHost: String!, expectedPort: Int!): Connection! @hasRole(roles: [ADMIN]) @stepUp

  """
  Changes the TLS mode. Leaving PINNED (or weakening further) is an
  audited security opt-out that raises a security alert and sets the
  insecureTransport badge.
  """
  setTlsMode(id: UUID!, mode: ConnectionTlsMode!): Connection! @hasRole(roles: [ADMIN]) @stepUp

  """
  Generates an ed25519 keypair for the SSH tunnel, stores the private key
  encrypted (replacing a stored SSH password or key) and returns only the
  public key.
  """
  generateConnectionSshKeypair(id: UUID!): ConnectionSshKeypair! @hasRole(roles: [ADMIN]) @stepUp

  """
  Creates a temporary restore connection inside the restore wizard (task
  4.4). It is validated like createConnection (TLS PINNED unless set
  otherwise, an audited opt-out; D-132) and expires
  restore.temp_connection_ttl from now. Pin its certificate / SSH host key
  with the usual mutations, then use it as a restore target; it never
  appears in connections and jobs cannot use it. At most 50 exist at a
  time (CONFLICT). Must be the only field of its operation.
  """
  createTemporaryConnection(input: CreateTemporaryConnectionInput!): Connection! @hasRole(roles: [ADMIN]) @stepUp

  """
  Moves the expiry of a temporary connection; at most
  restore.temp_connection_max_ttl after its creation (VALIDATION).
  """
  extendTemporaryConnection(id: UUID!, expiresAt: Time!): Connection! @hasRole(roles: [ADMIN]) @stepUp

  "Deletes a temporary connection now; its stored credentials are destroyed."
  deleteTemporaryConnection(id: UUID!): Boolean! @hasRole(roles: [ADMIN]) @stepUp
}

input CreateConnectionInput {
  name: String!
  engine: DatabaseEngine!
  versionKey: String!
  "Default: versionKey."
