  "Waiting for a worker or a concurrency slot."
  QUEUED
  RUNNING
  "Every database matched its source statistics."
  PASSED
  "No mismatch that proves data loss, but differences worth a look (estimates, unknown counts, source warnings)."
  WARNINGS
