# Audit log (task 1.4; D-101, D-106). Admin only.

extend type Query {
  """
  The audit log, newest first. `first` is 1..200 (default 50); `after` is
  the `endCursor` of the previous page.
  """
  auditLog(filter: AuditLogFilter, first: Int, after: String): AuditLogConnection!
    @hasRole(roles: [ADMIN])
}

"Who performed an audited action."
enum AuditActorKind {
  "A signed-in user."
  USER
  "bekup itself (scheduler, workers, startup checks)."
  SYSTEM
  "A host operator running a bekup subcommand."
  CLI
}

"Filters for auditLog; unset fields do not filter."
input AuditLogFilter {
  "Exact action name, e.g. `user.created`."
  action: String
  "Action prefix, e.g. `auth.` or `cli.admin.`."
  actionPrefix: String
  actorUserId: UUID
  actorKind: AuditActorKind
  targetType: String
  targetId: String
  "Entries at or after this time."
  from: Time
  "Entries before this time."
  to: Time
}

"A page of audit entries."
type AuditLogConnection {
  edges: [AuditLogEdge!]!
  pageInfo: PageInfo!
}

type AuditLogEdge {
  cursor: String!
  node: AuditLogEntry!
}

"One audit log entry. Details are redacted when recorded and never hold secrets."
type AuditLogEntry {
  id: ID!
  ts: Time!
  actorKind: AuditActorKind!
  actorUserId: UUID
  action: String!
  targetType: String
  targetId: String
  "Client IP address, if known."
  ip: String
  "Details as a JSON object."
  details: String!
  "The entry's chain hash (hex)."
  hash: String!
}
# Authentication: login, logout, the current user, own sessions and
# password changes (task 1.5; D-047, D-095, D-107). Second factors (tasks
# 1.7-1.9) extend LoginResult's flow.

type Mutation {
  """
  Signs in with e-mail and password and sets the session cookie (HttpOnly,
  SameSite=Strict; `__Host-` and Secure over https). Any failure answers
  UNAUTHENTICATED "invalid email or password", whatever the cause; too
  many attempts answer RATE_LIMITED. A session cookie the browser already
  had is revoked (the session is always rotated). For an account with a
  second factor the result has `secondFactorRequired: true` and the
  session can only complete it (completeSecondFactor) within 5 minutes.
  """
  login(email: String!, password: String!): LoginResult!

  "Ends the current session and clears the session cookie."
  logout: Boolean! @authenticated

  """
  Revokes one of your own sessions. Revoking the current session also
  clears the cookie. Unknown ids and other users' sessions answer
  NOT_FOUND.
  """
  revokeSession(id: UUID!): Boolean! @authenticated

  """
  Changes your password. Needs the current password (a wrong one answers
  VALIDATION on `currentPassword` and counts towards the lockout) and a
  fresh step-up (completeStepUp; a login without a second factor or the
  completed second factor of a login also count). Every
  session of your account is revoked; this browser gets a new session
  cookie.
  """
  changePassword(currentPassword: String!, newPassword: String!): Boolean! @stepUp
}

extend type Query {
  "The signed-in user."
  me: User @authenticated

  "Your active sessions, most recently used first."
  mySessions: [Session!]! @authenticated
}

"A bekup user as seen by themselves."
type User {
  id: UUID!
  email: String!
  displayName: String!
  role: Role!
}

"Kinds of second factors (tasks 1.7-1.9)."
enum SecondFactorKind {
  TOTP
  PASSKEY
  RECOVERY_CODE
}

"The result of login."
type LoginResult {
  """
  The signed-in user; null while secondFactorRequired is true (a login
  waiting for its second factor learns nothing about the account).
  """
  user: User
  """
  True when a second factor must be completed (completeSecondFactor)
  before the session can do anything but log out.
  """
  secondFactorRequired: Boolean!
  "The second factors the user can complete the login with."
  availableFactors: [SecondFactorKind!]!
}

"One of your sessions. The session token itself is never exposed."
type Session {
  id: UUID!
  createdAt: Time!
  lastSeenAt: Time!
  idleExpiresAt: Time!
  absoluteExpiresAt: Time!
  "Client IP address when the session was last used, if known."
  ip: String
  "Client User-Agent (truncated), if known."
  userAgent: String
  "Authentication assurance level: 1 password, 2 password + second factor."
  aal: Int!
  "True for the session of this request."
  current: Boolean!
}
# Database connections (task 2.11; D-106, D-132, D-133, D-135). Admins
# manage them; every change needs a fresh step-up and is audited.
# Maintainers see metadata only (name, engine, version, host, port, TLS mode,
# pin status and expiry, SSH enabled; `settings` is null for them) and may
# test connections and list their databases. Credentials are write-only:
# inputs accept new values, outputs only tell whether one is stored.
#
# serve never connects to a database: tests, version detection, database
# listing, image pre-pulls, certificate and host-key captures all run on the
# runner. Certificate pins and SSH host keys are never trusted
# automatically: fetch, compare out of band, confirm (step-up). A target
# whose certificate no longer matches the pin answers TLS_PIN_MISMATCH, a
# bastion with another host key SSH_HOST_KEY_MISMATCH (both audited and
# alerted). Other target failures answer CONNECTION_FAILED with a fixed
# message (testConnection reports them in its result instead).

"Database engines. MySQL and MariaDB are separate engines."
enum DatabaseEngine {
  POSTGRES
  MYSQL
  MARIADB
}

"Transport security towards the database server."
enum ConnectionTlsMode {
  "TLS verified against the pinned certificate only (the default)."
  PINNED
  "TLS without verification (insecure: audited opt-out)."
  UNVERIFIED
  "No TLS (insecure: audited opt-out)."
  DISABLED
}

"State of a connection's certificate pin."
enum TlsPinStatus {
  "The TLS mode is not PINNED."
  NOT_REQUIRED
  "PINNED without a confirmed pin: the connection cannot be used."
  MISSING
  VALID
  EXPIRES_WITHIN_30_DAYS
  EXPIRES_WITHIN_7_DAYS
  EXPIRED
}

"The credential the SSH tunnel authenticates with."
enum ConnectionSshAuthMethod {
  NONE
  PASSWORD
  PRIVATE_KEY
}

"A database connection."
type Connection {
  id: UUID!
  name: String!
  engine: DatabaseEngine!
  "Image catalog key of the server's release series (e.g. 17, 8.4, 11.8)."
  versionKey: String!
  "The version or client image is an end-of-life series."
  legacyVersion: Boolean!
  host: String!
  port: Int!
  tlsMode: ConnectionTlsMode!
  "Badge: TLS is not pinned (UNVERIFIED or DISABLED)."
  insecureTransport: Boolean!
  pinStatus: TlsPinStatus!
  "Expiry of the current pin (the earliest of the confirmed certificates)."
  pinExpiresAt: Time
  sshEnabled: Boolean!
  "True when the connection can be used (pin and, with SSH, host key and credential present)."
  ready: Boolean!
  "What is missing when not ready."
  notReadyReason: String
  createdAt: Time!
  updatedAt: Time!
  "The full non-secret configuration. Admins only: null for maintainers."
  settings: ConnectionSettings
}

type ConnectionSettings {
  "Image catalog key of the client image the runner uses."
  imageKey: String!
  username: String!
  hasPassword: Boolean!
  "Public TLS client certificate (its key is stored encrypted); null when none."
  clientCertificatePem: String
  "The current certificate pin; null until confirmCertificatePin."
  tlsPin: CertificatePin
  "A staged backup pin for a planned certificate rotation."
  backupPin: CertificatePin
  "The SSH tunnel; null when the database is reached directly."
  ssh: ConnectionSshSettings
}

"A confirmed certificate pin (public data)."
type CertificatePin {
  "The anchor: a self-signed server certificate or the root CA."
  certificatePem: String!
  subject: String!
  issuer: String!
  isCa: Boolean!
  "Expected leaf SPKI SHA-256 (base64); null for a CA pin that allows leaf rotation."
  leafSpkiSha256: String
  notAfter: Time!
  pinnedAt: Time!
}

type ConnectionSshSettings {
  host: String!
  port: Int!
  user: String!
  authMethod: ConnectionSshAuthMethod!
  hasPassword: Boolean!
  hasPrivateKey: Boolean!
  hasPassphrase: Boolean!
  "The authorized_keys line of the stored private key (install it on the bastion)."
  publicKey: String
  "The pinned host key; null until confirmSshHostKey."
  hostKey: SshHostKey
}

"An allowlisted engine version of the image catalog."
type EngineVersion {
  engine: DatabaseEngine!
  key: String!
  "The client version of the pinned image."
  clientVersion: String!
  legacy: Boolean!
}

"The result of testConnection: normalized codes and fixed messages only."
type ConnectionTestResult {
  ok: Boolean!
  "Failure code (e.g. TARGET_UNREACHABLE, TARGET_AUTH_FAILED, INCOMPATIBLE_CLIENT)."
  code: String
  message: String
  serverVersion: String
  "Catalog key matching the server; null when no allowlisted client fits."
  detectedVersionKey: String
  "The connection's client image can back up this server."
  compatible: Boolean!
  legacy: Boolean!
  "Stable warning codes (compatibility, certificate expiry, staged pin in use)."
  warnings: [String!]!
  databaseCount: Int!
}

type ConnectionVersionInfo {
  serverVersion: String!
  "The catalog key to use as versionKey and imageKey; null when none fits."
  suggestedVersionKey: String
  legacy: Boolean!
  "The connection's current client image fits the server."
  currentCompatible: Boolean!
  warnings: [String!]!
}

type ConnectionDatabases {
  "Databases reported by the server, without the engine's system databases."
  databases: [String!]!
  warnings: [String!]!
}

type ImagePrePullResult {
  "The digest-pinned image reference."
  imageRef: String!
  alreadyPresent: Boolean!
}

"A captured certificate chain. Nothing is trusted: compare it out of band."
type CertificateChain {
  "Leaf first, as presented by the server."
  certificates: [ChainCertificate!]!
  "The certificate to pin (self-signed leaf or root CA); null when the server presented none (supply the root CA as PEM)."
  suggestedAnchorIndex: Int
  "The leaf's SPKI SHA-256 (base64): pass it to confirmCertificatePin."
  leafSpkiSha256: String!
}

type ChainCertificate {
  pem: String!
  subject: String!
  issuer: String!
  dnsNames: [String!]!
  ipAddresses: [String!]!
  notBefore: Time!
  notAfter: Time!
  isCa: Boolean!
  selfSigned: Boolean!
  "SPKI SHA-256 as base64 and hex."
  spkiSha256: String!
  spkiSha256Hex: String!
  "SHA-256 of the certificate (DER, hex)."
  fingerprintSha256: String!
}

"The public half of a generated SSH keypair; the private key is stored encrypted and never returned."
type ConnectionSshKeypair {
  connection: Connection!
  "The authorized_keys line to install on the bastion."
  publicKey: String!
  fingerprintSha256: String!
}

extend type Query {
  "Connections that are not deleted, ordered by name."
  connections: [Connection!]! @hasRole(roles: [ADMIN, MAINTAINER])

  "One connection; null when it does not exist or was deleted."
  connection(id: UUID!): Connection @hasRole(roles: [ADMIN, MAINTAINER])

  "The allowlisted engine versions (image catalog) for versionKey and imageKey."
  engineVersions(engine: DatabaseEngine): [EngineVersion!]! @hasRole(roles: [ADMIN, MAINTAINER])
}

extend type Mutation {
  """
  Creates a connection (TLS mode PINNED unless set otherwise; any other
  mode is an audited opt-out). Pinned TLS to an IP address or localhost
  needs an SSH tunnel (D-132). A name already in use answers CONFLICT.
  """
  createConnection(input: CreateConnectionInput!): Connection! @hasRole(roles: [ADMIN]) @stepUp

  """
  Changes a connection. Credential fields left out keep the stored value.
  Changing the host or port removes the certificate pins; changing the
  bastion's host or port (or disableSsh) removes its host-key pin.
  """
  updateConnection(id: UUID!, input: UpdateConnectionInput!): Connection! @hasRole(roles: [ADMIN]) @stepUp

  "Soft deletes a connection (its name can be reused)."
  deleteConnection(id: UUID!): Boolean! @hasRole(roles: [ADMIN]) @stepUp

  """
  Connects with the stored credentials through the runner. Target failures
  are reported in the result; a certificate or host-key mismatch is an
  error. Rate limited; must be the only field of its operation.
  """
  testConnection(id: UUID!): ConnectionTestResult! @hasRole(roles: [ADMIN, MAINTAINER])

  "Asks the server for its version and suggests the catalog key. Rate limited; must be the only field of its operation."
  detectVersion(id: UUID!): ConnectionVersionInfo! @hasRole(roles: [ADMIN, MAINTAINER])

  "Lists the server's databases. Rate limited; must be the only field of its operation."
  listDatabases(id: UUID!): ConnectionDatabases! @hasRole(roles: [ADMIN, MAINTAINER])

  "Pulls the connection's client image on the runner (by digest). Must be the only field of its operation."
  prePullImage(id: UUID!): ImagePrePullResult! @hasRole(roles: [ADMIN, MAINTAINER])

  """
  Captures the server's TLS certificate chain through the runner without
  sending credentials. Stores and trusts nothing. Rate limited; must be
  the only field of its operation.
  """
  fetchCertificate(id: UUID!): CertificateChain! @hasRole(roles: [ADMIN])

  """
  Pins the certificate: certIndex into a fresh capture (bound to the leaf
  SPKI you compared) or a PEM supplied out of band. Confirming the staged
  backup pin promotes it. Must be the only field of its operation.
  """
  confirmCertificatePin(id: UUID!, input: CertificatePinInput!): Connection! @hasRole(roles: [ADMIN]) @stepUp

  "Stages a backup pin for a planned certificate rotation (needs a current pin). Must be the only field of its operation."
  stageBackupPin(id: UUID!, input: CertificatePinInput!): Connection! @hasRole(roles: [ADMIN]) @stepUp

  """
  Trust on first use: the runner connects to the SSH bastion and returns
  the host key it presents, without authenticating. Compare the
  fingerprint out of band before confirming it. Rate limited; must be the
  only field of its operation.
  """
  fetchSshHostKey(id: UUID!): SshHostKey! @hasRole(roles: [ADMIN])

  """
  Pins the SSH bastion's host key (an authorized_keys line).
  expectedHost/expectedPort are the bastion the key was fetched from
  (SshHostKey.host/port); CONFLICT if the bastion changed since.
  """
  confirmSshHostKey(id: UUID!, authorizedKey: String!, expectedHost: String!, expectedPort: Int!): Connection! @hasRole(roles: [ADMIN]) @stepUp

  """
  Changes the TLS mode. Leaving PINNED (or weakening further) is an
  audited security opt-out that raises a security alert and sets the
  insecureTransport badge.
  """
  setTlsMode(id: UUID!, mode: ConnectionTlsMode!): Connection! @hasRole(roles: [ADMIN]) @stepUp

  """
  Generates an ed25519 keypair for the SSH tunnel, stores the private key
  encrypted (replacing a stored SSH password or key) and returns only the
  public key.
  """
  generateConnectionSshKeypair(id: UUID!): ConnectionSshKeypair! @hasRole(roles: [ADMIN]) @stepUp
}

input CreateConnectionInput {
  name: String!
  engine: DatabaseEngine!
  versionKey: String!
  "Default: versionKey."
  imageKey: String
  host: String!
  "Default: 5432 (PostgreSQL) or 3306."
  port: Int
  username: String!
  "Write-only."
  password: String
  "Default PINNED; anything else is an audited opt-out."
  tlsMode: ConnectionTlsMode
  clientCertificatePem: String
  "Write-only; required together with clientCertificatePem."
  clientKeyPem: String
  ssh: ConnectionSshInput
}

"Fields to change; unset fields stay unchanged. The engine and TLS mode cannot change here."
input UpdateConnectionInput {
  name: String
  versionKey: String
  imageKey: String
  host: String
  port: Int
  username: String
  """
  Write-only; omit to keep the stored password. When host or port (or the
  tunnel route) changes, a stored password must be entered again or
  cleared in the same update (VALIDATION otherwise): bekup never sends a
  stored password to a new endpoint.
  """
  password: String
  clearPassword: Boolean
  clientCertificatePem: String
  "Write-only; required together with clientCertificatePem."
  clientKeyPem: String
  clearClientCertificate: Boolean
  "Sets (and enables) the SSH tunnel."
  ssh: ConnectionSshInput
  "Removes the SSH tunnel with its credentials and host-key pin."
  disableSsh: Boolean
}

input ConnectionSshInput {
  host: String!
  "Default 22."
  port: Int
  user: String!
  """
  Write-only; replaces a stored private key. Omit to keep the stored
  credential, except when host, port or user changes: a stored SSH
  password must then be entered again (or replaced by a key).
  """
  password: String
  "Write-only PEM private key; replaces a stored password. Prefer generateConnectionSshKeypair."
  privateKey: String
  "Write-only; only together with privateKey."
  privateKeyPassphrase: String
}

input CertificatePinInput {
  "Index into the chain fetchCertificate returned (re-captured and checked against leafSpkiSha256)."
  certIndex: Int
  "The anchor as PEM, supplied out of band (e.g. a root CA the server does not send)."
  certificatePem: String
  "The leaf's SPKI SHA-256 (base64 or hex) you compared; required unless allowLeafRotation."
  leafSpkiSha256: String
  "CA pins only: accept any leaf the CA issues for the host (no leaf binding)."
  allowLeafRotation: Boolean
}
# Backup destinations (task 2.12; D-106, D-131). Admins manage them; every
# change needs a fresh step-up and is audited. Maintainers see metadata only
# (name, type, mode flags, readiness; `settings` is null for them) and may
# test destinations. Credentials are write-only: inputs accept new values,
# outputs only tell whether one is stored (hasSecretAccessKey, hasPassword,
# hasPrivateKey). Destinations are soft deleted.

"Destination types."
enum DestinationType {
  DISK
  S3
  SFTP
}

"S3 Object Lock retention modes."
enum ObjectLockMode {
  GOVERNANCE
  COMPLIANCE
}

"S3 server-side encryption."
enum S3Encryption {
  NONE
  "SSE-S3 (provider-managed keys, AES256)."
  SSE_S3
  "SSE-KMS (kmsKeyId optional: the account's default key)."
  SSE_KMS
}

"How integrity checksums are sent to S3."
enum S3ChecksumMode {
  "A SHA-256 checksum with every upload (AWS S3 and compatible stores)."
  WHEN_SUPPORTED
  "Only where the protocol requires one (stores without flexible checksums)."
  WHEN_REQUIRED
}

"The credential an SFTP destination authenticates with."
enum SftpAuthMethod {
  NONE
  PASSWORD
  PRIVATE_KEY
}

"A backup destination."
type Destination {
  id: UUID!
  name: String!
  type: DestinationType!
  "True when bekup never deletes from this destination (retention is left to lifecycle rules)."
  noDelete: Boolean!
  "The S3 default Object Lock retention applied to every upload (null when off)."
  objectLockMode: ObjectLockMode
  objectLockRetentionDays: Int
  "True when the destination can be used (credentials and, for SFTP, a confirmed host key are present)."
  ready: Boolean!
  "What is missing when not ready."
  notReadyReason: String
  createdAt: Time!
  updatedAt: Time!
  "The full non-secret configuration. Admins only: null for maintainers."
  settings: DestinationSettings
}

"Per-type settings; exactly the field of the destination's type is set."
type DestinationSettings {
  disk: DiskDestinationSettings
  s3: S3DestinationSettings
  sftp: SftpDestinationSettings
}

type DiskDestinationSettings {
  "Directory below storage.disk_root."
  path: String!
}

type S3DestinationSettings {
  "The endpoint URL of an S3-compatible service; null means AWS S3."
  endpoint: String
  region: String!
  bucket: String!
  "Key prefix inside the bucket (empty: the bucket root)."
  prefix: String!
  pathStyle: Boolean!
  encryption: S3Encryption!
  kmsKeyId: String
  storageClass: String
  checksumMode: S3ChecksumMode!
  "Atomic never-overwrite with If-None-Match (disable only for stores that reject it)."
  conditionalWrites: Boolean!
  accessKeyId: String!
  hasSecretAccessKey: Boolean!
  "A custom CA bundle (PEM) that replaces the system roots for the endpoint."
  caBundlePem: String
}

type SftpDestinationSettings {
  host: String!
  port: Int!
  user: String!
  "Absolute base directory on the server."
  basePath: String!
  "Subdirectory below basePath (empty: basePath itself)."
  dir: String!
  authMethod: SftpAuthMethod!
  hasPassword: Boolean!
  hasPrivateKey: Boolean!
  hasPassphrase: Boolean!
  "The authorized_keys line of the stored private key (install it on the server)."
  publicKey: String
  "The pinned host key; null until confirmDestinationHostKey."
  hostKey: SshHostKey
}

"An SSH host key (public data)."
type SshHostKey {
  "Key type, e.g. ssh-ed25519."
  type: String!
  "OpenSSH SHA-256 fingerprint (SHA256:...)."
  fingerprintSha256: String!
  "The key as an authorized_keys line (type and base64, no comment)."
  authorizedKey: String!
  "When an admin pinned it; null for a fetched, unconfirmed key."
  confirmedAt: Time
  """
  The server the key was fetched from (fetch results only; null for a
  pinned key). Pass host and port back as expectedHost/expectedPort when
  confirming: the pin is refused (CONFLICT) if the record changed since.
  """
  host: String
  port: Int
}

"The result of testDestination: normalized codes and fixed messages only."
type DestinationTestResult {
  ok: Boolean!
  "Steps in order: connect, write, read, delete."
  steps: [DestinationTestStep!]!
  "The probe object's key (below the destination's prefix)."
  probeKey: String
  "True when the probe object was left behind (no-delete mode, Object Lock or a failed delete)."
  probeRemains: Boolean!
  note: String
}

type DestinationTestStep {
  name: String!
  ok: Boolean!
  "A normalized error class (ok, permission_denied, network, timeout, ...)."
  code: String!
  message: String!
}

"The public half of a generated SSH keypair; the private key is stored encrypted and never returned."
type DestinationSshKeypair {
  destination: Destination!
  "The authorized_keys line to install on the SFTP server."
  publicKey: String!
  fingerprintSha256: String!
}

extend type Query {
  "Destinations that are not deleted, ordered by name."
  destinations: [Destination!]! @hasRole(roles: [ADMIN, MAINTAINER])

  "One destination; null when it does not exist or was deleted."
  destination(id: UUID!): Destination @hasRole(roles: [ADMIN, MAINTAINER])
}

extend type Mutation {
  """
  Creates a destination. Exactly the settings input of `type` must be
  set. A name already in use answers CONFLICT. SFTP destinations become
  ready once their host key is confirmed and a password or key is set.
  """
  createDestination(input: CreateDestinationInput!): Destination! @hasRole(roles: [ADMIN]) @stepUp

  """
  Changes a destination. A settings input replaces the whole non-secret
  configuration of its type (credential fields left out keep the stored
  value). Changing an SFTP destination's host or port removes its pinned
  host key.
  """
  updateDestination(id: UUID!, input: UpdateDestinationInput!): Destination! @hasRole(roles: [ADMIN]) @stepUp

  "Soft deletes a destination (its name can be reused)."
  deleteDestination(id: UUID!): Boolean! @hasRole(roles: [ADMIN]) @stepUp

  """
  Writes, reads back and deletes a small probe object below the
  destination's prefix (no delete in no-delete mode). Rate limited; must be
  the only field of its operation.
  """
  testDestination(id: UUID!): DestinationTestResult! @hasRole(roles: [ADMIN, MAINTAINER])

  """
  Trust on first use: connects to the stored host and port of an SFTP
  destination through the SSRF guard and returns the host key it presents,
  without authenticating. Compare the fingerprint out of band before
  confirming it. Failures are normalized (unreachable, refused address,
  unsupported key type). Rate limited; must be the only field of its
  operation.
  """
  fetchDestinationHostKey(id: UUID!): SshHostKey! @hasRole(roles: [ADMIN])

  """
  Pins the host key of an SFTP destination (an authorized_keys line).
  expectedHost/expectedPort are the host and port the key was fetched from
  (SshHostKey.host/port); CONFLICT if the destination changed since.
  """
  confirmDestinationHostKey(id: UUID!, authorizedKey: String!, expectedHost: String!, expectedPort: Int!): Destination! @hasRole(roles: [ADMIN]) @stepUp

  """
  Generates an ed25519 keypair for an SFTP destination, stores the private
  key encrypted (replacing a stored password or key) and returns only the
  public key.
  """
  generateDestinationSshKeypair(id: UUID!): DestinationSshKeypair! @hasRole(roles: [ADMIN]) @stepUp
}

input CreateDestinationInput {
  name: String!
  type: DestinationType!
  "Never delete from this destination (default false)."
  noDelete: Boolean
  disk: DiskDestinationInput
  s3: S3DestinationInput
  sftp: SftpDestinationInput
}

"Fields to change; unset fields stay unchanged."
input UpdateDestinationInput {
  name: String
  noDelete: Boolean
  disk: DiskDestinationInput
  s3: S3DestinationInput
  sftp: SftpDestinationInput
}

input DiskDestinationInput {
  "Directory below storage.disk_root (relative; no '..')."
  path: String!
}

input S3DestinationInput {
  "https URL of an S3-compatible service (http only in dev mode); omit for AWS S3."
  endpoint: String
  region: String!
  bucket: String!
  prefix: String
  pathStyle: Boolean
  encryption: S3Encryption
  kmsKeyId: String
  storageClass: String
  checksumMode: S3ChecksumMode
  "Default true."
  conditionalWrites: Boolean
  "Default Object Lock retention (requires a bucket with Object Lock)."
  objectLockMode: ObjectLockMode
  objectLockRetentionDays: Int
  accessKeyId: String!
  "Write-only. Required when creating; omit to keep the stored key."
  secretAccessKey: String
  caBundlePem: String
}

input SftpDestinationInput {
  host: String!
  "Default 22."
  port: Int
  user: String!
  basePath: String!
  dir: String
  """
  Write-only; replaces a stored private key. Omit to keep the stored
  credential, except when host, port, user or basePath changes: a stored
  password must then be entered again (or replaced by a key).
  """
  password: String
  "Write-only PEM private key; replaces a stored password. Prefer generateDestinationSshKeypair."
  privateKey: String
  "Write-only; only together with privateKey."
  privateKeyPassphrase: String
}
# bekup GraphQL schema: shared scalars, directives and types (task 1.2).
# Feature tasks add their own *.graphqls files next to this one and extend
# Query/Mutation/Subscription with `extend type`.
#
# Access convention (D-105): every root field (Query/Mutation/Subscription)
# carries @authenticated, @hasRole or @stepUp, or is listed in the public
# allowlist in internal/graph/access.go, and every guarded root field maps to
# an authz operation in graph.RootFieldOperations (D-106). Anything else is
# denied at runtime and fails the policy test.

"An RFC 3339 timestamp with time zone, e.g. `2026-10-26T12:00:00Z`."
scalar Time

"A UUID in its canonical textual form."
scalar UUID

"Roles of bekup users (D-011)."
enum Role {
  ADMIN
  MAINTAINER
  USER
}

"""
The field requires an authenticated session. Implied by @hasRole and
@stepUp.
"""
directive @authenticated on FIELD_DEFINITION

"The field requires an authenticated session with one of the given roles."
directive @hasRole(roles: [Role!]!) on FIELD_DEFINITION

"""
The field requires a fresh step-up within security.stepup_max_age
(completeStepUp: a second factor for accounts with one, the password
otherwise).
"""
directive @stepUp on FIELD_DEFINITION

"Relay-style pagination info of a connection."
type PageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
  endCursor: String
}

type Query {
  "Public, non-secret facts about this server (needed before login)."
  serverInfo: ServerInfo!
}

"Public information about the running server. Never contains secrets."
type ServerInfo {
  "The bekup version."
  version: String!
  """
  True when server.base_url is not https: traffic, sessions and credentials
  are not encrypted (D-095). The UI shows a permanent warning banner.
  """
  insecureTransport: Boolean!
  "True when dev mode is on (never in production)."
  devMode: Boolean!
}
# Subscriptions (tasks 1.10 and 2.13, D-050, D-105). Subscriptions run only
# as Server-Sent Events: POST /graphql with Content-Type application/json and
# Accept: text/event-stream, one subscription per request (graphql-sse,
# distinct connections mode); the caller is the session of the cookie sent
# with that request. When the server ends a stream it sends a final error
# event whose extensions.code is UNAUTHENTICATED (the session ended),
# FORBIDDEN (its access changed), SESSION_ROTATED (it was rotated: open the
# stream again) or UNAVAILABLE (shutdown or a failed session check: retry
# later), then the complete event. Every event is re-authorized when it is
# delivered.

type Subscription {
  """
  Changes to your own sessions (one revoked or rotated, or all of them
  revoked), e.g. to refresh the session list. When the change ends the
  session of this stream, the stream ends with its final error event (see
  above) and the notice may not arrive first.
  """
  sessionEvents: SessionEvent! @authenticated
}

"What happened to a session."
enum SessionEventKind {
  "The session ended (logout, revoked, replaced by a new login)."
  REVOKED
  "The session was replaced by a new one (privilege change)."
  ROTATED
  "All of your sessions ended (password, role or status change)."
  ALL_REVOKED
}

"A change to one or all of your sessions. Carries identifiers only."
type SessionEvent {
  kind: SessionEventKind!
  "The session that changed; null when all sessions were revoked."
  sessionId: UUID
  "True when the change concerns the session of this stream."
  current: Boolean!
}
# TOTP and recovery codes (task 1.7; D-111). Changing second factors needs
# a fresh step-up (D-047, D-106). Verifying a TOTP or recovery code during
# login or step-up is part of task 1.9's two-step login.

extend type Mutation {
  """
  Starts (or restarts) TOTP enrollment for your account. Returns the key
  as an otpauth URI, an inline SVG QR code and a base32 key for manual
  entry; this is the only time the key is shown. Confirm it with
  confirmTotpEnrollment before `expiresAt`. CONFLICT when TOTP is already
  enabled (disable it first). Needs a fresh step-up.
  """
  beginTotpEnrollment: TotpEnrollment! @stepUp

  """
  Completes the pending TOTP enrollment with a current code from the
  authenticator app and returns a new set of recovery codes, shown only
  this once (any older codes stop working). A wrong code answers
  VALIDATION on `code`; no pending enrollment answers CONFLICT. Needs a
  fresh step-up.
  """
  confirmTotpEnrollment(code: String!): RecoveryCodes! @stepUp

  """
  Turns TOTP off for your account. Refused with CONFLICT when it is your
  last second factor and the 2FA policy requires one. When no second
  factor remains, the recovery codes are deleted too. Needs a fresh
  step-up.
  """
  disableTotp: Boolean! @stepUp

  """
  Replaces your recovery codes with a new set, shown only this once. Needs
  an enrolled second factor (CONFLICT otherwise) and a fresh step-up.
  """
  regenerateRecoveryCodes: RecoveryCodes! @stepUp
}

extend type Query {
  "Your second-factor state. Never contains a secret or a code."
  myTwoFactorStatus: TwoFactorStatus! @authenticated
}

"A begun TOTP enrollment. Every field but expiresAt carries the TOTP key."
type TotpEnrollment {
  "The otpauth:// key URI (for authenticator apps on this device)."
  otpauthUri: String!
  """
  The key URI as a QR code: a self-contained SVG document (no scripts,
  styles or data: URIs) to render inline.
  """
  qrCodeSvg: String!
  "The key in base32 for manual entry (SHA-1, 6 digits, 30 seconds)."
  manualEntryKey: String!
  "Confirm before this time or start again."
  expiresAt: Time!
}

"A new set of single-use recovery codes. They are never shown again."
type RecoveryCodes {
  codes: [String!]!
}

"Your second factors."
type TwoFactorStatus {
  totpEnabled: Boolean!
  totpEnabledAt: Time
  "True while a begun TOTP enrollment can still be confirmed."
  totpEnrollmentPending: Boolean!
  "Unused recovery codes left."
  recoveryCodesRemaining: Int!
}
# Two-step login, step-up and the 2FA policy (task 1.9; D-047, D-057,
# D-095, D-112).
#
# A login of an account with a second factor answers
# `secondFactorRequired: true`: the session cookie then belongs to a
# session waiting for the second factor (5 minutes) that can do nothing
# but completeSecondFactor, beginPasskeyLogin and logout (everything else:
# SECOND_FACTOR_REQUIRED). Step-up uses a second factor for accounts with
# one and the password only for accounts without.

"How a step-up is performed."
enum StepUpMethod {
  "Re-enter the password (only for accounts without a second factor)."
  PASSWORD
  TOTP
  PASSKEY
  "A recovery code: sets the step-up time only (not enough for restores) and raises an alert."
  RECOVERY_CODE
}

"How the caller can step up (beginStepUp)."
type StepUpChallenge {
  "The usable methods, in order of preference."
  methods: [StepUpMethod!]!
  """
  PublicKeyCredentialRequestOptions (`{"publicKey": {...}}`) when a passkey
  can be used; the challenge is bound to this session for 3 minutes.
  """
  passkeyOptions: JSON
}

"A successful step-up."
type StepUpResult {
  stepUpAt: Time!
  "Set when a passkey or TOTP was used (restores need this within the step-up window)."
  aal2At: Time
  "The session's assurance level afterwards."
  aal: Int!
}

"The 2FA policy (admin)."
type TwoFactorPolicy {
  "A second factor is required for every role."
  requireForAll: Boolean!
  "Roles that require a second factor (in addition to requireForAll)."
  requiredRoles: [Role!]!
  """
  Days a user without a second factor keeps full access after the
  requirement starts for their role (or their account was created, if
  later); 0 means immediately. Afterwards they can only enroll a factor.
  """
  gracePeriodDays: Int!
  "When the policy was last changed (null: the built-in default)."
  updatedAt: Time
  """
  False when passkeys cannot be used with this server (plain http on a
  host other than localhost, D-095): users enroll TOTP instead, so the
  policy can always be met.
  """
  passkeysAvailable: Boolean!
}

input TwoFactorPolicyInput {
  requireForAll: Boolean!
  requiredRoles: [Role!]!
  "0 to 90."
  gracePeriodDays: Int!
}

extend type User {
  "True when the 2FA policy requires a second factor for this account's role."
  twoFactorRequired: Boolean!
  """
  When 2FA is required and the account has no second factor: the end of
  its enrollment grace period (in the past: only enrolling a factor is
  allowed, REQUIRES_2FA_ENROLLMENT). Null otherwise.
  """
  twoFactorEnrollmentDeadline: Time
}

extend type LoginResult {
  """
  True when the 2FA policy requires a second factor, the account has none
  and the grace period is over: the session may only enroll a factor.
  """
  twoFactorEnrollmentRequired: Boolean!
}

extend type Query {
  "The 2FA policy."
  twoFactorPolicy: TwoFactorPolicy! @hasRole(roles: [ADMIN])
}

extend type Mutation {
  """
  Starts the passkey check of a login waiting for its second factor and
  returns the PublicKeyCredentialRequestOptions JSON. CONFLICT when the
  session is not waiting for a second factor; FORBIDDEN when passkeys are
  unavailable.
  """
  beginPasskeyLogin: JSON! @authenticated

  """
  Completes a login waiting for its second factor with a TOTP code
  (`code`), a recovery code (`code`) or the browser's passkey response
  (`assertion`, after beginPasskeyLogin). On success the session is
  replaced by a fully signed-in one (new cookie, AAL 2, fresh step-up). A
  wrong code or response answers VALIDATION and counts towards the
  second-factor lockout (RATE_LIMITED while locked).
  """
  completeSecondFactor(method: SecondFactorKind!, code: String, assertion: JSON): LoginResult! @authenticated

  """
  Lists the step-up methods of your account and, when a passkey can be
  used, starts its check.
  """
  beginStepUp: StepUpChallenge! @authenticated

  """
  Confirms your identity again (step-up, valid for
  security.stepup_max_age): with a second factor when your account has one
  (`code` for TOTP and recovery codes, `assertion` for a passkey after
  beginStepUp), with your password (`password`) otherwise. A wrong
  password counts towards the login lockout, a wrong code towards the
  second-factor lockout.
  """
  completeStepUp(method: StepUpMethod!, code: String, password: String, assertion: JSON): StepUpResult! @authenticated

  """
  Changes the 2FA policy. Turning the requirement on for a role starts its
  grace period now. Needs a fresh step-up; audited; weakening the policy
  raises a security alert.
  """
  updateTwoFactorPolicy(input: TwoFactorPolicyInput!): TwoFactorPolicy! @hasRole(roles: [ADMIN]) @stepUp
}
# User administration (task 1.6; D-047, D-069, D-106, D-110). Admin only;
# every change needs a fresh step-up and is audited. Role changes,
# disabling, password resets and deletion revoke all sessions of the
# account. The last active admin cannot be demoted, disabled or deleted
# (CONFLICT). Accounts are soft deleted (audit entries reference them).

extend type User {
  "True when the account is disabled (it cannot sign in)."
  disabled: Boolean!
  "Set while new password logins are locked after failed attempts."
  lockedUntil: Time
  """
  True while the account's password is a temporary one issued by an admin:
  after signing in with it, only changePassword (and viewing the own
  account) is allowed (PASSWORD_CHANGE_REQUIRED).
  """
  passwordChangeRequired: Boolean!
  "When the temporary password stops working, if one is set."
  temporaryPasswordExpiresAt: Time
  createdAt: Time!
  updatedAt: Time!
  "Set when the account was deleted (only visible to admins listing deleted accounts)."
  deletedAt: Time
}

extend type LoginResult {
  """
  True when the user signed in with a temporary password and must change
  it (changePassword) before doing anything else.
  """
  passwordChangeRequired: Boolean!
}

extend type Query {
  """
  Accounts ordered by e-mail address. `first` is 1..200 (default 50);
  `after` is the `endCursor` of the previous page.
  """
  users(filter: UserFilter, first: Int, after: String): UserConnection! @hasRole(roles: [ADMIN])

  "One account (also a deleted one); null when it does not exist."
  user(id: UUID!): User @hasRole(roles: [ADMIN])

  "The active sessions of an account, most recently used first."
  userSessions(userId: UUID!): [Session!]! @hasRole(roles: [ADMIN])
}

extend type Mutation {
  """
  Creates an account with a generated temporary password (returned once;
  valid for 72 hours) that must be changed at the first login. Admins never
  choose another user's password. A taken e-mail address answers CONFLICT.
  """
  createUser(input: CreateUserInput!): CreatedUser! @hasRole(roles: [ADMIN]) @stepUp

  """
  Changes the display name, role and/or disabled flag. A role change or
  disabling revokes all sessions of the account.
  """
  updateUser(id: UUID!, input: UpdateUserInput!): User! @hasRole(roles: [ADMIN]) @stepUp

  """
  Replaces the account's password with a generated temporary password
  (returned once), clears the lockout and revokes all its sessions. Use
  changePassword for your own account.
  """
  resetUserPassword(id: UUID!): TemporaryPassword! @hasRole(roles: [ADMIN]) @stepUp

  "Disables the account and revokes all its sessions."
  disableUser(id: UUID!): User! @hasRole(roles: [ADMIN]) @stepUp

  "Enables a disabled account."
  enableUser(id: UUID!): User! @hasRole(roles: [ADMIN]) @stepUp

  "Clears the login lockout of the account."
  unlockUser(id: UUID!): User! @hasRole(roles: [ADMIN]) @stepUp

  """
  Deletes the account (soft delete: it is disabled, its password removed
  and its sessions revoked; the record stays for the audit log and its
  e-mail address can be reused). You cannot delete your own account.
  """
  deleteUser(id: UUID!): Boolean! @hasRole(roles: [ADMIN]) @stepUp

  "Revokes every session of the account; returns how many were active."
  revokeUserSessions(userId: UUID!): Int! @hasRole(roles: [ADMIN]) @stepUp

  """
  Lost-factor recovery (task 1.9, D-112): removes every second factor of
  the account (TOTP, passkeys, recovery codes), clears its second-factor
  lockout and revokes all its sessions. When the 2FA policy requires a
  factor for the account's role, a new enrollment grace period starts now.
  Not allowed on your own account (FORBIDDEN).
  """
  resetUserSecondFactors(userId: UUID!): SecondFactorReset! @hasRole(roles: [ADMIN]) @stepUp
}

"The result of resetUserSecondFactors."
type SecondFactorReset {
  user: User!
  "True when the account had TOTP enabled."
  removedTotp: Boolean!
  "The number of passkeys removed."
  removedPasskeys: Int!
  "The number of recovery codes removed (used or not)."
  removedRecoveryCodes: Int!
  "The number of sessions revoked."
  revokedSessions: Int!
}

"Filters for users; unset fields do not filter."
input UserFilter {
  "Case-insensitive substring of the e-mail address or display name."
  search: String
  role: Role
  disabled: Boolean
  "Also list deleted accounts (default false)."
  includeDeleted: Boolean
}

input CreateUserInput {
  email: String!
  displayName: String!
  role: Role!
}

"Fields to change; unset fields stay unchanged."
input UpdateUserInput {
  displayName: String
  role: Role
  disabled: Boolean
}

"A page of accounts."
type UserConnection {
  edges: [UserEdge!]!
  pageInfo: PageInfo!
}

type UserEdge {
  cursor: String!
  node: User!
}

"A newly created account and its one-time temporary password."
type CreatedUser {
  user: User!
  temporaryPassword: TemporaryPassword!
}

"""
A generated temporary password. Shown once: it is not stored in plain text
and cannot be retrieved again. The user must change it at the first login.
"""
type TemporaryPassword {
  password: String!
  expiresAt: Time!
}
# WebAuthn passkeys as a second factor (task 1.8; D-095, D-109). The
# assertion half (second step of the login, step-up) is exposed by task
# 1.9. Passkeys need a secure context: with an http base_url on a host
# other than localhost they are unavailable and enrollment is refused.

"""
A JSON value passed through unchanged: WebAuthn options returned to the
browser and the browser's responses. Input must be a JSON object of at
most 32 KiB.
"""
scalar JSON

"Whether passkeys can be used with this server."
type WebAuthnStatus {
  "False when server.base_url is not a secure context (https or localhost) or uses an IP address."
  webauthnAvailable: Boolean!
  "Why passkeys are unavailable (null when available)."
  reason: String
  "The relying party ID (the base URL's host name; null when unavailable)."
  rpId: String
}

"""
One of your passkeys. The credential id and public key are never
exposed.
"""
type Passkey {
  id: UUID!
  name: String!
  createdAt: Time!
  lastUsedAt: Time
  "Transports reported by the authenticator (usb, nfc, ble, internal, hybrid)."
  transports: [String!]!
  "The authenticator model's AAGUID, if reported."
  aaguid: UUID
  "True for passkeys that can be synced or backed up (BE flag)."
  backupEligible: Boolean!
  "True when the passkey is currently backed up or synced (BS flag)."
  backedUp: Boolean!
  "True when the authenticator verified the user (PIN or biometrics)."
  userVerified: Boolean!
  """
  When an assertion with a signature counter that went backwards was
  refused: the passkey may have been cloned. Consider deleting it.
  """
  signCountAnomalyAt: Time
}

extend type Query {
  "Whether passkeys can be used with this server, and why not."
  webauthnStatus: WebAuthnStatus! @authenticated

  "Your passkeys, oldest first."
  myPasskeys: [Passkey!]! @authenticated
}

extend type Mutation {
  """
  Starts registering a passkey (needs a fresh step-up). Returns the
  PublicKeyCredentialCreationOptions as JSON (`{"publicKey": {...}}`) for
  `navigator.credentials.create()`. The challenge is bound to this
  session and valid for 3 minutes. Fails with FORBIDDEN when passkeys are
  unavailable and CONFLICT when you already have 20 passkeys.
  """
  beginPasskeyRegistration: JSON! @stepUp

  """
  Completes the registration with the browser's response
  (`PublicKeyCredential.toJSON()`) and stores the passkey under `name`
  (1-64 characters). Needs a fresh step-up. A response that does not
  verify (or no pending registration) answers VALIDATION on `response`;
  start again with beginPasskeyRegistration.
  """
  finishPasskeyRegistration(name: String!, response: JSON!): Passkey! @stepUp

  "Renames one of your passkeys (needs a fresh step-up)."
  renamePasskey(id: UUID!, name: String!): Passkey! @stepUp

  """
  Deletes one of your passkeys (needs a fresh step-up). The 2FA policy
  may refuse to remove your last second factor (CONFLICT).
  """
  deletePasskey(id: UUID!): Boolean! @stepUp
}
