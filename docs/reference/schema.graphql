  runner: RunnerHealth!
  "Sorted by component; unreadable files are left out."
  certificates: [CertificateExpiry!]!
  "Null when the app database could not be read."
  queue: [QueueDepth!]
  "Earliest expiry of a pinned target-database certificate (null: none)."
