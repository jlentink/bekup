# bekup.toml: configuration of `bekup serve` and `bekup worker`.
#
# Copy to ./bekup.toml or /etc/bekup/bekup.toml (or pass --config <path> /
# BEKUP_CONFIG). The first file found wins; files are never merged. The file
# must be a regular file owned by the bekup user or root and must not be
# group- or world-writable (chmod 0644 or stricter). Unknown keys are errors.
#
# Precedence: built-in defaults < this file < BEKUP_<SECTION>_<KEY> env vars
# < command-line flags. Example: [server] base_url -> BEKUP_SERVER_BASE_URL.
# Lists in env vars are comma-separated; durations use Go syntax ("15m").
#
# Secrets are NEVER written here: secret keys only exist as *_file paths
# (Docker secrets). Secret files must not be group/world-writable or
# world-readable (chmod 0400/0600). Every value below is the built-in default
# unless marked "example".
#
# Full reference: docs/configuration.md

[server]
# Plain-HTTP listener on the internal proxy network. Never publish this port.
# Example; match your network: serve's fixed `frontend` address in
# docker-compose.yml (SERVE_FRONTEND_IP). The built-in default ":8080" binds
# every interface and is refused outside dev mode unless
# allow_wildcard_listen = true.
listen = "10.213.250.10:8080"
# Allow a wildcard listen address (":8080", "0.0.0.0:8080", "[::]:8080")
# outside dev mode. Logs a warning at every startup.
allow_wildcard_listen = false
# Public https URL served by the reverse proxy (example; required). http is
# only accepted in dev mode or with allow_insecure_http = true.
base_url = "https://backup.example.com"
# Knowingly run over plain HTTP without the TLS reverse proxy (D-095).
# Sessions and credentials then travel UNENCRYPTED; bekup warns at every
# startup and shows a permanent red banner. trusted_proxies may then be empty.
allow_insecure_http = false
# CIDRs of the reverse proxy; X-Forwarded-* from anyone else is ignored
# (example; required outside dev mode). 0.0.0.0/0 is rejected. With the
# compose proxy profiles (traefik | nginx) name exactly the proxy's fixed
# `frontend` address (PROXY_FRONTEND_IP), not the whole subnet.
trusted_proxies = ["10.213.250.5/32"]
read_header_timeout = "10s"
# Whole-request read limit (headers + body).
read_timeout = "30s"
# Response write limit. WebSocket subscriptions and artifact downloads
# override it per route.
write_timeout = "60s"
# Keep-alive idle limit.
idle_timeout = "120s"
shutdown_timeout = "30s"
# Maximum size of the request headers in bytes (32 KiB).
max_header_bytes = 32768
# Maximum request body size in bytes (1 MiB).
max_body_bytes = 1048576
# Per-client-IP rate limit (token bucket): sustained requests per second and
# burst. The client IP is the peer address, or X-Forwarded-For when the peer
# is in trusted_proxies. Exceeding it returns 429 with Retry-After.
rate_limit_per_second = 20.0
rate_limit_burst = 100
# Maximum client IPs tracked (least recently seen are evicted).
rate_limit_max_clients = 10000
# Per-user limit for authenticated /graphql and /api requests (on top of the
# per-IP limit).
user_rate_limit_per_second = 20.0
user_rate_limit_burst = 100
max_ws_connections_per_user = 5

[graphql]
# Limits of one GraphQL operation (D-105); larger operations are rejected
# before execution. Complexity counts 1 per selected field.
max_complexity = 1000
max_depth = 12
# Maximum GraphQL request body in bytes (256 KiB; at most server.max_body_bytes).
max_body_bytes = 262144
# WebSocket subscriptions (task 1.10): GET /graphql upgrades with the
# graphql-transport-ws protocol, authenticated by the session cookie. The
# per-user connection cap is server.max_ws_connections_per_user.
# Connections per instance, all users together (beyond: 503).
ws_max_connections = 1000
# Active subscriptions per connection.
ws_max_subscriptions_per_connection = 20
# Largest client message in bytes (at most max_body_bytes).
ws_max_message_bytes = 65536
# Time to send connection_init after the upgrade.
ws_init_timeout = "10s"
# Server ping interval; no pong within twice the interval disconnects.
ws_ping_interval = "25s"
# Periodic session re-check of every connection (revocations normally close
# sockets at once through session events; this is the fallback bound).
ws_revalidate_interval = "30s"
# Maximum age of a session check before an event is delivered.
ws_session_check_ttl = "5s"

[database]
# File with the Postgres URL of the bekup app DB (postgres://bekup_app:...).
url_file = "/run/secrets/bekup_database_url"
# Dev mode only, rejected otherwise:
# url = "postgres://bekup_app:bekup@localhost:5432/bekup"
# File with the Postgres URL of the bekup_owner role (postgres://bekup_owner:...).
# Only `bekup migrate` reads it; mount it only where migrations run.
owner_url_file = "/run/secrets/bekup_database_owner_url"
# Dev mode only, rejected otherwise:
# owner_url = "postgres://bekup_owner:bekup_owner@localhost:5432/bekup"
max_conns = 10
min_conns = 0
conn_max_lifetime = "1h"
conn_max_idle_time = "30m"
connect_timeout = "10s"
statement_timeout = "30s"
# TLS to the app DB (D-100). verify-full (default) verifies the Postgres
# server certificate against tls_ca_file (never the system roots) and the
# URL's host name. require / disable are weaker and logged as a warning at
# every startup. An sslmode in the URL may not be stricter than tls_mode.
tls_mode = "verify-full"
# CA bundle from `bekup certs init --component postgres`
# (<dir>/postgres/ca.crt), mounted as a Docker secret.
tls_ca_file = "/run/secrets/bekup_db_ca.crt"
# Optional client certificate + key for Postgres `clientcert` setups (both
# or neither), e.g. "/run/secrets/bekup_db_client.crt" / ".key".
tls_client_cert_file = ""
tls_client_key_file = ""

[security]
# Master keyring created by `bekup keys generate`. Back it up (escrow):
# without it the stored credentials cannot be decrypted.
master_key_file = "/run/secrets/bekup_master_key"
# Dev mode only, rejected otherwise:
# master_key = "..."
session_idle_timeout = "30m"
session_absolute_timeout = "12h"
# Sliding idle refresh: last-seen/idle expiry are written at most this often.
session_touch_interval = "1m"
# Fresh second factor validity for sensitive actions (at most 5m).
stepup_max_age = "5m"
# argon2id parameters can only be raised above these defaults.
argon2_memory_kib = 65536
argon2_iterations = 3
argon2_parallelism = 1
# Concurrent hash operations (each uses argon2_memory_kib of memory).
argon2_max_concurrent = 4
# Password policy: minimum length (characters) and zxcvbn score (0-4); both
# can only be raised. Common passwords and passwords containing the e-mail
# address are always refused.
password_min_length = 12
password_min_score = 3
# Login attempts per client IP (stricter than the server-wide limit); the
# same rate also limits password verifications per account.
login_rate_limit_per_minute = 10
login_rate_limit_burst = 5
# Account lockout: after lockout_threshold consecutive failures the account
# is locked for lockout_base_duration, doubling per further failure up to
# lockout_max_duration.
lockout_threshold = 5
lockout_base_duration = "1m"
lockout_max_duration = "1h"
# serve signs the audit chain head (instance key) this often when new audit
# entries exist (1m to 24h).
audit_head_sign_interval = "1h"

[runner]
# mTLS gRPC endpoint of `bekup runner` (certificates from `bekup certs init`).
address = "runner:7443"
server_name = "runner"
cert_file = "/run/secrets/bekup_client.crt"
key_file = "/run/secrets/bekup_client.key"
ca_file = "/run/secrets/bekup_ca.crt"
dial_timeout = "10s"

[storage]
# Disk destinations are confined below this directory.
disk_root = "/var/lib/bekup/backups"
scratch_dir = "/var/lib/bekup/scratch"

[workers]
max_concurrent_runs = 4
max_runs_per_connection = 1
max_concurrent_downloads = 4
backup_timeout = "6h"
restore_timeout = "12h"
notify_timeout = "30s"

[scheduler]
enabled = true
tick_interval = "15s"

[notifications]
max_per_user_per_hour = 30
collapse_window = "15m"
webhook_failure_threshold = 5

[netguard]
# Bootstrap SSRF allowlist for private destinations (S3/SMTP/SFTP/webhooks).
# Empty = all private, loopback, link-local and metadata ranges are denied.
allow_cidrs = []
allow_hosts = []

[metrics]
# Prometheus /metrics on an internal address only.
enabled = true
listen = "127.0.0.1:9464"

[log]
# debug | info | warn | error
level = "info"
# json | text (text is the default in dev mode)
format = "json"

[dev]
# Dev mode relaxes guardrails (http base_url, no trusted_proxies, inline
# secrets, runs without a config file). Never enable it in production.
enabled = false
