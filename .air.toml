# air hot-reload configuration (https://github.com/air-verse/air).
# Used by the `dev` stage of the Dockerfile via docker-compose.dev.yml, and
# usable on the host with `air` directly.
#
# Inside the dev container the source tree is mounted READ-ONLY, so every
# build output goes to /air (a nonroot-owned volume); see the compose
# override, which passes --tmp_dir/--build.* flags. On the host the defaults
# below write to ./tmp (gitignored via /tmp/ and dockerignored).

root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -trimpath -o ./tmp/bekup ./cmd/bekup"
  entrypoint = ["./tmp/bekup"]
  args_bin = ["serve"]
  include_ext = ["go", "toml", "sql", "graphql", "proto"]
  exclude_dir = ["tmp", "web", "node_modules", "docs", "plans", "deploy", "secrets", ".dev-data", ".git", ".github", ".idea", ".claude"]
  exclude_regex = ["_test\\.go$"]
  delay = 500
  kill_delay = "2s"
  send_interrupt = true
  stop_on_error = true
  log = "air-build-errors.log"

[log]
  time = true
  main_only = false

[misc]
  clean_on_exit = true

[screen]
  clear_on_rebuild = false
