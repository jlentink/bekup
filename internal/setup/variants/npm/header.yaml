# bekup compose.yaml: bekup behind Nginx Proxy Manager (D-205).
# Docs: https://github.com/jlentink/bekup/blob/main/docs/installation/reverse-proxy.md#nginx-proxy-manager
#
# GENERATED from the repository's docker-compose.yml by `just gen`; never
# edit it by hand. Two forms differ only in the x-bekup-image line below:
#   - the release asset compose.npm.yaml: the image is pinned by
#     digest and the file is attested. Verify it (after saving it as
#     compose.yaml): gh attestation verify compose.yaml --repo jlentink/bekup
#     (needs `gh auth login`, or use cosign verify-blob);
#   - deploy/compose/compose.npm.yaml in the repository: the image comes
#     from BEKUP_IMAGE (digest-pinned); setup keeps it in .env.
#
# Once: create the link network and attach Nginx Proxy Manager to it with a
# fixed address, then recreate NPM:
#   docker network create --internal --subnet 10.213.253.0/28 \
#     --gateway 10.213.253.1 --ip-range 10.213.253.12/30 bekup-proxy
#   (--ip-range keeps Docker's automatic addresses off .5 and .10), then in
#   NPM's compose file, KEEPING the networks it already has:
#     services: app: networks: default: {} (or its existing ones, list
#       form converted to a map), bekup-proxy: ipv4_address: 10.213.253.5
#     networks: bekup-proxy: external: true
# Install, as root in an empty directory (e.g. /opt/bekup):
#   1. Save this file there as compose.yaml.
#   2. DOCKER_GID=$(stat -c %g /var/run/docker.sock) docker compose run --rm setup
#      (repository copy: prefix BEKUP_IMAGE=<repo>:<tag>@sha256:<digest>)
#   3. docker compose up -d
#      docker compose run --rm admin create --email you@example.com --display-name "Your Name"
# Then add the Proxy Host in NPM: scheme http, forward to 10.213.253.10 port
# 8080, Websockets Support OFF, SSL with Let's Encrypt, Force SSL and HTTP/2
# on, HSTS off (bekup sends it), plus the Advanced block from the docs.
# Upgrade: back up, replace this file with the new release's file, then:
#   docker compose run --rm setup upgrade && docker compose pull && docker compose up -d
#   (repository copy: keep this file current from deploy/compose/ and run
#   BEKUP_IMAGE=<new image> docker compose run --rm setup upgrade instead)
#
# Do not edit this file: put local changes into compose.override.yaml
# (`docker compose -f compose.yaml run --rm setup check` lints both; -f keeps
# the override away from the checking container). setup writes the
# compose variables to .env.
#
# Components and trust boundaries:
#   Nginx Proxy Manager (10.213.253.5) ──bekup-proxy (external, internal)──> serve (10.213.253.10)
#   serve ──backend (TLS, verify-full)──> postgres  (role bekup_app; migrations as bekup_owner)
#   serve ──runner-ctl (mTLS gRPC)──> runner ──docker.sock──> dockerd
#   runner ──targets──> target databases   (runner only; serve can never reach them)
#   serve ──egress──> S3 / SFTP / SMTP / webhooks (SSRF-guarded in the app)
