  # Your PostgreSQL (fields mode, D-207): the bekup_app password (serve,
  # admin, migrate; in single-account mode the account's password) and the
  # bekup_owner password (migrate only; empty in single-account mode).
  # Written by setup, readable only by UID 65532.
  bekup_database_password:
    file: ${BEKUP_KEYS_DIR:-./secrets}/bekup_database_password
  bekup_database_owner_password:
    file: ${BEKUP_KEYS_DIR:-./secrets}/bekup_database_owner_password
