      proxy:
        # YOUR reverse proxy's Docker network (BEKUP_PROXY_NETWORK). Your
        # proxy forwards https://<domain>/api/v1/ to
        # http://bekup-external-api:8081; external-api.toml [listen]
        # trusted_proxy_hosts names your proxy's container (link mode:
        # trusted_proxies its fixed address), so only it may forward client
        # addresses (X-Forwarded-For).
        aliases: [bekup-external-api]
