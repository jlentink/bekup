# Engine image catalog: the runner's embedded image allowlist (D-031).
#
# Every image is the official Docker Hub image pinned by its multi-arch OCI
# image index digest (resolved with `docker buildx imagetools inspect`).
# The client version is taken from the tag; `key` must equal its release
# series (PostgreSQL: major, MySQL/MariaDB: major.minor). Renovate updates
# the `image = "..."` lines (see renovate.json); a tag whose series no longer
# matches its key, or a client below the per-series minimum
# (internal/engine/floors.go), fails validation at startup and in tests.
#
# PostgreSQL: only clients with the psql \restrict fix (CVE-2025-8714:
# 13.22, 14.19, 15.14, 16.10, 17.6, 18.0) are pinned.
# MySQL: LTS series only (8.4, 9.7) plus legacy 8.0; no innovation releases.
# MariaDB: LTS series only; 10.6 is legacy.
# `legacy = true` marks end-of-life series (shown in the UI).
# `uid` (optional, never 0) is the non-root user the tools run as; omitted =
# the official image's database user (postgres alpine 70, mysql/mariadb 999).
#
# Operators can add images with the runner's [images] extra_file (same
# schema; it cannot replace an entry below).

schema_version = 1

# --- postgres ---

[[images]]
engine = "postgres"
key = "13"  # EOL 2025-11
image = "postgres:13.23-alpine@sha256:fb9065b6e3e213bdc07edd372a5b2a26245840b7fb65d1fd8b6700106d51805c"
legacy = true
binaries = { dump = "pg_dump", dump_globals = "pg_dumpall", restore = "pg_restore", client = "psql" }

