# git-cliff configuration (https://git-cliff.org/docs/configuration).
# Turns Conventional Commits into a Keep a Changelog style CHANGELOG.md.
# Used by `just bump` (scripts/bump.sh, D-072); do not edit CHANGELOG.md by hand.

[changelog]
header = """
# Changelog

All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).
This file is generated by [git-cliff](https://git-cliff.org/) from
Conventional Commits via `just bump`.
"""
body = """
{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## [Unreleased]
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
{% if commit.breaking %}**BREAKING:** {% endif %}\
{{ commit.message | split(pat="\n") | first | trim | upper_first }}\
{% endfor %}
{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
sort_commits = "oldest"
# Keep a Changelog sections. The <!-- N --> prefixes fix the section order
# and are stripped by `striptags` in the template.
commit_parsers = [
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore\\(deps", skip = true },
  { body = ".*security", group = "<!-- 0 -->Security" },
  { message = "^sec", group = "<!-- 0 -->Security" },
  { message = "^feat", group = "<!-- 1 -->Added" },
  { message = "^fix", group = "<!-- 3 -->Fixed" },
  { message = "^perf", group = "<!-- 2 -->Changed" },
  { message = "^refactor", group = "<!-- 2 -->Changed" },
  { message = "^revert", group = "<!-- 4 -->Removed" },
  { message = "^docs", group = "<!-- 5 -->Documentation" },
  { message = "^(build|ci|test|style|chore)", skip = true },
]
